      type: BOOL
      REQUIRED: false
      comment: Indicates if the port in process will require a personal identification number (PIN) and an account number for this phone number. If this is true you will be required to submit both a PIN and account number from the losing carrier for this number when opening a port in request. These fields will be required in order to complete the port in process to Twilio.
    - name: not_portable_reason
      type: STRING
      REQUIRED: false
