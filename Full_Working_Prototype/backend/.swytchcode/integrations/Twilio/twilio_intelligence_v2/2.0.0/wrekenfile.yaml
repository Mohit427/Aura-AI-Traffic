      comment: The unique SID identifier of the Account the Custom Operator belongs to.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Custom Operator.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human-readable name of this resource, up to 64 characters.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A human-readable description of this resource, longer than the friendly name.
    - name: author
      type: STRING
      REQUIRED: false
      comment: The creator of the Custom Operator. Custom Operators can only be created by a Twilio Account.
    - name: operator_type
      type: STRING
      REQUIRED: false
      comment: Operator Type for this Operator. References an existing Operator Type resource.
    - name: version
      type: INT
      REQUIRED: false
      comment: Numeric Custom Operator version. Incremented with each update on the resource, used to ensure integrity when updating the Custom Operator.
    - name: availability
      type: STRING
      REQUIRED: false
