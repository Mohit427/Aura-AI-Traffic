STRUCTS:
  verify.v2.service.access_token:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Access Token.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Verify Service.
    - name: entity_identity
      type: STRING
      REQUIRED: false
      comment: The unique external identifier for the Entity of the Service.
    - name: factor_type
      type: STRING
      REQUIRED: false
    - name: factor_friendly_name
      type: STRING
      REQUIRED: false
      comment: A human readable description of this factor, up to 64 characters. For a push factor, this can be the device's name.
    - name: token
      type: STRING
      REQUIRED: false
      comment: The access token generated for enrollment, this is an encrypted json web token.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
    - name: ttl
      type: INT
      REQUIRED: false
      comment: "How long, in seconds, the access token is valid. Max: 5 minutes"
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this access token was created, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
  verify.v2.service.rate_limit.bucket:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Bucket.
    - name: rate_limit_sid
      type: STRING
      REQUIRED: false
      comment: The Twilio-provided string that uniquely identifies the Rate Limit resource.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Service](https://www.twilio.com/docs/verify/api/service) the resource is associated with.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Rate Limit resource.
    - name: max
      type: INT
      REQUIRED: false
      comment: Maximum number of requests permitted in during the interval.
    - name: interval
      type: INT
      REQUIRED: false
      comment: Number of seconds that the rate limit will be enforced over.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
  verify.v2.service.entity.challenge:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Challenge.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Service.
    - name: entity_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Entity.
    - name: identity
      type: STRING
      REQUIRED: false
      comment: Customer unique identity for the Entity owner of the Challenge. This identifier should be immutable, not PII, length between 8 and 64 characters, and generated by your external system, such as your user's UUID, GUID, or SID. It can only contain dash (-) separated alphanumeric characters.
    - name: factor_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Factor.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Challenge was created, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Challenge was updated, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_responded
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Challenge was responded, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: expiration_date
      type: TIMESTAMP
      REQUIRED: false
      comment: The date-time when this Challenge expires, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format. The default value is five (5) minutes after Challenge creation. The max value is sixty (60) minutes after creation.
    - name: status
      type: STRING
      REQUIRED: false
    - name: responded_reason
      type: STRING
      REQUIRED: false
    - name: details
      type: ANY
      REQUIRED: false
      comment: Details provided to give context about the Challenge. Intended to be shown to the end user.
    - name: hidden_details
      type: ANY
      REQUIRED: false
      comment: "Details provided to give context about the Challenge. Intended to be hidden from the end user. It must be a stringified JSON with only strings values eg. `{\"ip\": \"172.168.1.234\"}`"
    - name: metadata
      type: ANY
      REQUIRED: false
      comment: "Custom metadata associated with the challenge. This is added by the Device/SDK directly to allow for the inclusion of device information. It must be a stringified JSON with only strings values eg. `{\"os\": \"Android\"}`. Can be up to 1024 characters in length."
    - name: factor_type
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: Contains a dictionary of URL links to nested resources of this Challenge.
  verify.v2.service.entity:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Entity.
    - name: identity
      type: STRING
      REQUIRED: false
      comment: The unique external identifier for the Entity of the Service. This identifier should be immutable, not PII, length between 8 and 64 characters, and generated by your external system, such as your user's UUID, GUID, or SID. It can only contain dash (-) separated alphanumeric characters.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Service.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Entity was created, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
