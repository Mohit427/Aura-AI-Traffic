STRUCTS:
  ScimUser:
    - name: id
      type: STRING
      REQUIRED: false
      comment: Unique Twilio user sid
    - name: externalId
      type: STRING
      REQUIRED: false
      comment: External unique resource id defined by provisioning client
    - name: userName
      type: STRING
      REQUIRED: true
      comment: Unique username, MUST be same as primary email address
    - name: displayName
      type: STRING
      REQUIRED: false
      comment: User friendly display name
    - name: name
      type: STRUCT(ScimName)
      REQUIRED: false
    - name: emails
      type: "[]STRUCT(ScimEmailAddress)"
      REQUIRED: false
      comment: Email address list of the user. Primary email must be defined if there are more than 1 email. Primary email must match the username.
    - name: active
      type: BOOL
      REQUIRED: false
      comment: Indicates whether the user is active
    - name: locale
      type: STRING
      REQUIRED: false
      comment: User's locale
    - name: timezone
      type: STRING
      REQUIRED: false
      comment: User's time zone
    - name: schemas
      type: "[]STRING"
      REQUIRED: false
      comment: An array of URIs that indicate the schemas supported for this user resource
    - name: meta
      type: STRUCT(ScimMeta)
      REQUIRED: false
  ScimName:
    - name: givenName
      type: STRING
      REQUIRED: false
      comment: The user's first or given name
    - name: familyName
      type: STRING
      REQUIRED: false
      comment: The user's last or family name
  ScimEmailAddress:
    - name: primary
      type: BOOL
      REQUIRED: false
      comment: Indicates if this email address is the primary one
    - name: value
      type: STRING
      REQUIRED: false
      comment: The actual email address value
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of email address (e.g., work, home, etc.)
  ScimMeta:
    - name: resourceType
      type: STRING
      REQUIRED: false
      comment: Indicates the type of the resource
    - name: created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time when the resource was created in the system
    - name: lastModified
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time when the resource was last modified
    - name: version
      type: STRING
      REQUIRED: false
      comment: A version identifier for the resource. This can be used to manage resource versioning and concurrency control.
  ScimPatchRequest:
    - name: schemas
      type: "[]STRING"
      REQUIRED: false
    - name: Operations
      type: "[]STRUCT(ScimPatchOperation)"
      REQUIRED: false
  ScimPatchOperation:
    - name: op
      type: STRING
      REQUIRED: false
      comment: The operation to perform
    - name: path
      type: STRING
      REQUIRED: false
    - name: value
      type: OBJECT
      REQUIRED: false
  PublicApiAccountResponse:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: Twilio account sid
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: Account friendly name
    - name: status
      type: STRING
      REQUIRED: false
      comment: Account status
    - name: owner_sid
      type: STRING
      REQUIRED: false
      comment: Twilio account sid
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time when the account was created in the system
  PublicApiAccountResponsePage:
    - name: content
      type: "[]STRUCT(PublicApiAccountResponse)"
      REQUIRED: false
      comment: Page content
    - name: meta
      type: OBJECT
      REQUIRED: false
  PublicApiCreateRoleAssignmentRequest:
    - name: role_sid
      type: STRING
      REQUIRED: true
      comment: Twilio Role Sid representing assigned role
    - name: scope
      type: STRING
      REQUIRED: true
      comment: Twilio Sid representing scope of this assignment
    - name: identity
      type: STRING
      REQUIRED: true
      comment: Twilio Sid representing identity of this assignment
    - name: resource_type
      type: STRING
      REQUIRED: false
      comment: The resource type for resource-level role assignments
    - name: resource_id
      type: STRING
      REQUIRED: false
      comment: The resource id for resource-level role assignments
  PublicApiCreateRoleAssignmentResponsePage:
    - name: content
