      comment: The [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
    - name: outbound_prefix_prices
      type: "[]ANY"
      REQUIRED: false
      comment: The list of [OutboundPrefixPriceWithOrigin](https://www.twilio.com/docs/voice/pricing#outbound-prefix-price-with-origin) records.
    - name: inbound_call_prices
      type: "[]ANY"
