    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account the Service belongs to.
    - name: auto_redaction
      type: BOOL
      REQUIRED: false
      comment: Instructs the Speech Recognition service to automatically redact PII from all transcripts made on this service.
    - name: media_redaction
      type: BOOL
      REQUIRED: false
      comment: Instructs the Speech Recognition service to automatically redact PII from all transcripts media made on this service. The auto_redaction flag must be enabled, results in error otherwise.
    - name: auto_transcribe
      type: BOOL
      REQUIRED: false
      comment: Instructs the Speech Recognition service to automatically transcribe all recordings made on the account.
    - name: data_logging
      type: BOOL
      REQUIRED: false
      comment: |-
        Data logging allows Twilio to improve the quality of the speech recognition & language understanding services through using customer data to refine, fine tune and evaluate machine learning models.
        Note: Data logging cannot be activated via API, only via www.twilio.com, as it requires additional consent.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Service was created, given in ISO 8601 format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Service was updated, given in ISO 8601 format.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human readable description of this resource, up to 64 characters.
    - name: language_code
      type: STRING
      REQUIRED: false
      comment: The language code set during Service creation determines the Transcription language for all call recordings processed by that Service. The default is en-US if no language code is set. A Service can only support one language code, and it cannot be updated once it's set.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Service.
    - name: unique_name
      type: STRING
      REQUIRED: false
      comment: Provides a unique and addressable name to be assigned to this Service, assigned by the developer, to be optionally used in addition to SID.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
    - name: webhook_url
      type: STRING
      REQUIRED: false
      comment: The URL Twilio will request when executing the Webhook.
    - name: webhook_http_method
      type: STRING
      REQUIRED: false
    - name: read_only_attached_operator_sids
      type: "[]STRING"
      REQUIRED: false
      comment: Operator sids attached to this service, read only
    - name: version
      type: INT
      REQUIRED: false
      comment: The version number of this Service.
    - name: encryption_credential_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Public Key resource used to encrypt the sentences and operator results.
  intelligence.v2.transcript:
