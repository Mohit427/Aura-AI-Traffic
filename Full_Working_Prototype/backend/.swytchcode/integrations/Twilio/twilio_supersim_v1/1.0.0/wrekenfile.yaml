  supersim.v1.usage_record:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that incurred the usage.
    - name: sim_sid
      type: STRING
      REQUIRED: false
      comment: SID of a Sim resource to which the UsageRecord belongs. Value will only be present when either a value for the `Sim` query parameter is provided or when UsageRecords are grouped by `sim`. Otherwise, the value will be `null`.
    - name: network_sid
      type: STRING
      REQUIRED: false
      comment: SID of the Network resource the usage occurred on. Value will only be present when either a value for the `Network` query parameter is provided or when UsageRecords are grouped by `network`. Otherwise, the value will be `null`.
    - name: fleet_sid
      type: STRING
      REQUIRED: false
      comment: SID of the Fleet resource the usage occurred on. Value will only be present when either a value for the `Fleet` query parameter is provided or when UsageRecords are grouped by `fleet`. Otherwise, the value will be `null`.
    - name: iso_country
      type: STRING
      REQUIRED: false
      comment: Alpha-2 ISO Country Code that the usage occurred in. Value will only be present when either a value for the `IsoCountry` query parameter is provided or when UsageRecords are grouped by `isoCountry`. Otherwise, the value will be `null`.
    - name: period
      type: ANY
      REQUIRED: false
      comment: The time period for which the usage is reported. The period is represented as a pair of `start_time` and `end_time` timestamps specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: data_upload
      type: INT
      REQUIRED: false
      comment: Total data uploaded in bytes, aggregated by the query parameters.
    - name: data_download
