STRUCTS:
  assistants.v1.service.assistant_send_message_request:
    - name: identity
      type: STRING
      REQUIRED: true
      comment: The unique identity of user for the session.
    - name: session_id
      type: STRING
      REQUIRED: false
      comment: The unique name for the session.
    - name: body
      type: STRING
      REQUIRED: true
      comment: The query to ask the assistant.
    - name: webhook
      type: STRING
      REQUIRED: false
      comment: The webhook url to call after the assistant has generated a response or report an error.
    - name: mode
      type: STRING
      REQUIRED: false
      comment: one of the modes 'chat', 'email' or 'voice'
  assistants.v1.service.assistant_send_message_response:
    - name: status
      type: STRING
      REQUIRED: true
      comment: success or failure based on whether the request successfully generated a response.
    - name: flagged
      type: BOOL
      REQUIRED: false
      comment: If successful, this property will denote whether the response was flagged or not.
    - name: aborted
      type: BOOL
      REQUIRED: false
      comment: This property will denote whether the request was aborted or not.
    - name: session_id
      type: STRING
      REQUIRED: true
      comment: The unique name for the session.
    - name: account_sid
