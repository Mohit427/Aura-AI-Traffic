STRUCTS:
  wireless.v1.account_usage_record:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the AccountUsageRecord resource.
    - name: period
      type: ANY
      REQUIRED: false
      comment: The time period for which usage is reported. Contains `start` and `end` properties that describe the period using GMT date-time values specified in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
    - name: commands
      type: ANY
      REQUIRED: false
      comment: An object that describes the aggregated Commands usage for all SIMs during the specified period. See [Commands Usage Object](https://www.twilio.com/docs/iot/wireless/api/account-usagerecord-resource#commands-usage-object).
    - name: data
      type: ANY
      REQUIRED: false
      comment: An object that describes the aggregated Data usage for all SIMs over the period. See [Data Usage Object](https://www.twilio.com/docs/iot/wireless/api/account-usagerecord-resource#data-usage-object).
  wireless.v1.command:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Command resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Command resource.
    - name: sim_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Sim resource](https://www.twilio.com/docs/iot/wireless/api/sim-resource) that the Command was sent to or from.
    - name: command
      type: STRING
      REQUIRED: false
      comment: The message being sent to or from the SIM. For text mode messages, this can be up to 160 characters. For binary mode messages, this is a series of up to 140 bytes of data encoded using base64.
    - name: command_mode
      type: STRING
      REQUIRED: false
    - name: transport
      type: STRING
      REQUIRED: false
    - name: delivery_receipt_requested
      type: BOOL
      REQUIRED: false
      comment: Whether to request a delivery receipt.
    - name: status
      type: STRING
      REQUIRED: false
    - name: direction
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  wireless.v1.sim.data_session:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the DataSession resource.
    - name: sim_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Sim resource](https://www.twilio.com/docs/iot/wireless/api/sim-resource) that the Data Session is for.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the DataSession resource.
    - name: radio_link
      type: STRING
      REQUIRED: false
      comment: The generation of wireless technology that the device was using.
    - name: operator_mcc
      type: STRING
      REQUIRED: false
      comment: "The 'mobile country code' is the unique ID of the home country where the Data Session took place. See: [MCC/MNC lookup](http://mcc-mnc.com/)."
    - name: operator_mnc
      type: STRING
      REQUIRED: false
      comment: The 'mobile network code' is the unique ID specific to the mobile operator network where the Data Session took place.
    - name: operator_country
      type: STRING
      REQUIRED: false
      comment: The three letter country code representing where the device's Data Session took place. This is determined by looking up the `operator_mcc`.
    - name: operator_name
      type: STRING
      REQUIRED: false
      comment: The friendly name of the mobile operator network that the [SIM](https://www.twilio.com/docs/iot/wireless/api/sim-resource)-connected device is attached to. This is determined by looking up the `operator_mnc`.
    - name: cell_id
      type: STRING
      REQUIRED: false
      comment: The unique ID of the cellular tower that the device was attached to at the moment when the Data Session was last updated.
    - name: cell_location_estimate
      type: ANY
      REQUIRED: false
      comment: "An object that describes the estimated location in latitude and longitude where the device's Data Session took place. The location is derived from the `cell_id` when the Data Session was last updated. See [Cell Location Estimate Object](https://www.twilio.com/docs/iot/wireless/api/datasession-resource#cell-location-estimate-object). "
    - name: packets_uploaded
      type: INT
      REQUIRED: false
      comment: The number of packets uploaded by the device between the `start` time and when the Data Session was last updated.
    - name: packets_downloaded
      type: INT
      REQUIRED: false
      comment: The number of packets downloaded by the device between the `start` time and when the Data Session was last updated.
    - name: last_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that the resource was last updated, given as GMT in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
    - name: start
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that the Data Session started, given as GMT in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
    - name: end
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that the record ended, given as GMT in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format.
    - name: imei
      type: STRING
      REQUIRED: false
      comment: "The 'international mobile equipment identity' is the unique ID of the device using the SIM to connect. An IMEI is a 15-digit string: 14 digits for the device identifier plus a check digit calculated using the Luhn formula."
  wireless.v1.rate_plan:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the RatePlan resource.
    - name: unique_name
      type: STRING
      REQUIRED: false
      comment: An application-defined string that uniquely identifies the resource. It can be used in place of the resource's `sid` in the URL to address the resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the RatePlan resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: data_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether SIMs can use GPRS/3G/4G/LTE data connectivity.
    - name: data_metering
      type: STRING
      REQUIRED: false
      comment: "The model used to meter data usage. Can be: `payg` and `quota-1`, `quota-10`, and `quota-50`. Learn more about the available [data metering models](https://www.twilio.com/docs/iot/wireless/api/rateplan-resource#payg-vs-quota-data-plans)."
    - name: data_limit
      type: INT
      REQUIRED: false
      comment: The total data usage (download and upload combined) in Megabytes that the Network allows during one month on the home network (T-Mobile USA). The metering period begins the day of activation and ends on the same day in the following month. Can be up to 2TB.
    - name: messaging_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether SIMs can make, send, and receive SMS using [Commands](https://www.twilio.com/docs/iot/wireless/api/command-resource).
    - name: voice_enabled
      type: BOOL
      REQUIRED: false
      comment: Deprecated. Whether SIMs can make and receive voice calls.
    - name: national_roaming_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether SIMs can roam on networks other than the home network (T-Mobile USA) in the United States. See [national roaming](https://www.twilio.com/docs/iot/wireless/api/rateplan-resource#national-roaming).
    - name: national_roaming_data_limit
      type: INT
      REQUIRED: false
      comment: The total data usage (download and upload combined) in Megabytes that the Network allows during one month on non-home networks in the United States. The metering period begins the day of activation and ends on the same day in the following month. Can be up to 2TB.
    - name: international_roaming
      type: "[]STRING"
      REQUIRED: false
