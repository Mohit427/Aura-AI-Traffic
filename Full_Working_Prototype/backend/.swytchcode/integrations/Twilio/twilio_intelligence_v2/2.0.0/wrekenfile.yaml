      - RETURNTYPE: STRUCT(api.transcript.listResponse200)
        RETURNVAR: twilio_intelligence_transcript_list
        STATUS: 200
    CANONICAL_ID: twilio_intelligence.transcript.list
  twilio_intelligence.transcript.get:
    SUMMARY: Fetch a specific Transcript.
    DESC: Fetch a specific Transcript.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/Transcripts/{Sid}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(intelligence.v2.transcript)
        RETURNVAR: twilio_intelligence_transcript_get
        STATUS: 200
    CANONICAL_ID: twilio_intelligence.transcript.get
  twilio_intelligence.transcript.delete:
    SUMMARY: Delete a specific Transcript.
    DESC: Delete a specific Transcript.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v2/Transcripts/{Sid}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    CANONICAL_ID: twilio_intelligence.transcript.delete
STRUCTS:
  intelligence.v2.custom_operator:
    - name: account_sid
      type: STRING
