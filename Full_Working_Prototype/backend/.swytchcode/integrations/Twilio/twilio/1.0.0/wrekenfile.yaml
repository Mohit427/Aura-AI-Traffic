  api.v2010.account.balance:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: balance
      type: STRING
      REQUIRED: false
      comment: The balance of the Account, in units specified by the unit parameter. Balance changes may not be reflected immediately. Child accounts do not contain balance information
    - name: currency
      type: STRING
      REQUIRED: false
      comment: The units of currency for the account balance
  api.v2010.account.call:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify this Call resource.
    - name: date_created
      type: STRING
      REQUIRED: false
      comment: The date and time in UTC that this resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: STRING
      REQUIRED: false
      comment: The date and time in UTC that this resource was last updated, specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: parent_call_sid
      type: STRING
      REQUIRED: false
      comment: The SID that identifies the call that created this leg.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created this Call resource.
    - name: to
      type: STRING
      REQUIRED: false
      comment: The phone number, SIP address, Client identifier or SIM SID that received this call. Phone numbers are in [E.164](https://www.twilio.com/docs/glossary/what-e164) format (e.g., +16175551212). SIP addresses are formatted as `name@company.com`. Client identifiers are formatted `client:name`. SIM SIDs are formatted as `sim:sid`.
    - name: to_formatted
      type: STRING
      REQUIRED: false
      comment: The phone number, SIP address or Client identifier that received this call. Formatted for display. Non-North American phone numbers are in [E.164](https://www.twilio.com/docs/glossary/what-e164) format (e.g., +442071838750).
    - name: from
      type: STRING
      REQUIRED: false
      comment: The phone number, SIP address, Client identifier or SIM SID that made this call. Phone numbers are in [E.164](https://www.twilio.com/docs/glossary/what-e164) format (e.g., +16175551212). SIP addresses are formatted as `name@company.com`. Client identifiers are formatted `client:name`. SIM SIDs are formatted as `sim:sid`.
    - name: from_formatted
      type: STRING
      REQUIRED: false
      comment: The calling phone number, SIP address, or Client identifier formatted for display. Non-North American phone numbers are in [E.164](https://www.twilio.com/docs/glossary/what-e164) format (e.g., +442071838750).
    - name: phone_number_sid
      type: STRING
      REQUIRED: false
      comment: If the call was inbound, this is the SID of the IncomingPhoneNumber resource that received the call. If the call was outbound, it is the SID of the OutgoingCallerId resource from which the call was placed.
    - name: status
      type: STRING
      REQUIRED: false
    - name: start_time
      type: STRING
      REQUIRED: false
      comment: The start time of the call, given as UTC in [RFC 2822](https://www.php.net/manual/en/class.datetime.php#datetime.constants.rfc2822) format. Empty if the call has not yet been dialed.
    - name: end_time
      type: STRING
      REQUIRED: false
      comment: The time the call ended, given as UTC in [RFC 2822](https://www.php.net/manual/en/class.datetime.php#datetime.constants.rfc2822) format. Empty if the call did not complete successfully.
    - name: duration
      type: STRING
      REQUIRED: false
      comment: The length of the call in seconds. This value is empty for busy, failed, unanswered, or ongoing calls.
    - name: price
      type: STRING
      REQUIRED: false
      comment: The charge for this call, in the currency associated with the account. Populated after the call is completed. May not be immediately available. The price associated with a call only reflects the charge for connectivity.  Charges for other call-related features such as Answering Machine Detection, Text-To-Speech, and SIP REFER are not included in this value.
    - name: price_unit
      type: STRING
      REQUIRED: false
      comment: The currency in which `Price` is measured, in [ISO 4127](https://www.iso.org/iso/home/standards/currency_codes.htm) format (e.g., `USD`, `EUR`, `JPY`). Always capitalized for calls.
    - name: direction
      type: STRING
      REQUIRED: false
      comment: "A string describing the direction of the call. Can be: `inbound` for inbound calls, `outbound-api` for calls initiated via the REST API or `outbound-dial` for calls initiated by a `<Dial>` verb. Using [Elastic SIP Trunking](https://www.twilio.com/docs/sip-trunking), the values can be [`trunking-terminating`](https://www.twilio.com/docs/sip-trunking#termination) for outgoing calls from your communications infrastructure to the PSTN or [`trunking-originating`](https://www.twilio.com/docs/sip-trunking#origination) for incoming calls to your communications infrastructure from the PSTN."
    - name: answered_by
      type: STRING
      REQUIRED: false
      comment: Either `human` or `machine` if this call was initiated with answering machine detection. Empty otherwise.
    - name: api_version
      type: STRING
      REQUIRED: false
      comment: The API version used to create the call.
    - name: forwarded_from
      type: STRING
      REQUIRED: false
      comment: The forwarding phone number if this call was an incoming call forwarded from another number (depends on carrier supporting forwarding). Otherwise, empty.
    - name: group_sid
      type: STRING
      REQUIRED: false
      comment: The Group SID associated with this call. If no Group is associated with the call, the field is empty.
    - name: caller_name
      type: STRING
      REQUIRED: false
      comment: The caller's name if this call was an incoming call to a phone number with caller ID Lookup enabled. Otherwise, empty.
    - name: queue_time
      type: STRING
      REQUIRED: false
      comment: The wait time in milliseconds before the call is placed.
    - name: trunk_sid
      type: STRING
      REQUIRED: false
      comment: The unique identifier of the trunk resource that was used for this call. The field is empty if the call was not made using a SIP trunk or if the call is not terminated.
    - name: uri
      type: STRING
      REQUIRED: false
      comment: The URI of this resource, relative to `https://api.twilio.com`.
    - name: subresource_uris
