VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://knowledge.twilio.com
METHODS:
  twilio_knowledge.knowledgebas.knowledge.get:
    SUMMARY: List Knowledge Sources
    DESC: |-
      Retrieve a paginated list of all knowledge sources for a specific knowledge base.  Knowledge sources represent
      unstructured data sources such as documents,  websites, or text content that can be used for context and information
      retrieval.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/KnowledgeBases/{kbId}/Knowledge
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - kbId:
          TYPE: STRING
          LOCATION: path
      - page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 50
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.knowledgebas.knowledge.getResponse200)
        RETURNVAR: twilio_knowledge_knowledgebas_knowledge_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_knowledge.knowledgebas.knowledge.get
  twilio_knowledge.knowledgebas.knowledge.create:
    SUMMARY: Create Knowledge Source
    DESC: |-
      Create a new knowledge source from various data sources such as web content,  files, or raw text. The
      knowledge source will be processed and indexed to enable semantic search and retrieval.

      ## Best practices

      To maximize the effectiveness of Knowledge, consider the following best practices:

      **Assess and optimize content:** Regularly evaluate your existing Knowledge sources for accuracy, relevance, and coverage.
      Identify any gaps or outdated information that could hinder the Assistant's performance.

      **Simplify and structure content:** Ensure that the content is clear and concise. Use headings, bullet points, and metadata to make information straightforward
      to navigate for both the AI Assistant and your users.

      **Prioritize high-impact content:** Focus on updating and
      maintaining content that is frequently accessed or critical to customer interactions. Consider using analytics to
      determine which Knowledge entries are most valuable.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/KnowledgeBases/{kbId}/Knowledge
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(KnowledgeCore)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - kbId:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(KnowledgeCore)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Knowledge)
        RETURNVAR: twilio_knowledge_knowledgebas_knowledge_create_201
        STATUS: 201
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_knowledge.knowledgebas.knowledge.create
  twilio_knowledge.knowledgebas.search.create:
    SUMMARY: Search Knowledge Chunks
    DESC: |-
      Perform semantic search across knowledge sources within a knowledge base to find the most relevant content
      chunks based on a natural language query.  Returns ranked chunks with similarity scores, allowing you to retrieve
      contextually relevant information for AI applications, chatbots, or  information retrieval systems. You can filter
      results by specific knowledge sources.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/KnowledgeBases/{kbId}/Search
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(KnowledgeSearch)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - kbId:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(KnowledgeSearch)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.knowledgebas.search.createResponse200)
        RETURNVAR: twilio_knowledge_knowledgebas_search_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_knowledge.knowledgebas.search.create
  twilio_knowledge.knowledgebas.knowledge.get.1:
    SUMMARY: Retrieve Knowledge Source
    DESC: |-
      Fetch detailed information about a specific knowledge source by its ID.  This returns the complete knowledge
      source object including  processing status, source details, and configuration information.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/KnowledgeBases/{kbId}/Knowledge/{knowledgeId}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - kbId:
          TYPE: STRING
          LOCATION: path
      - knowledgeId:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(Knowledge)
        RETURNVAR: twilio_knowledge_knowledgebas_knowledge_get_1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_knowledge.knowledgebas.knowledge.get.1
  twilio_knowledge.knowledgebas.knowledge.update:
    SUMMARY: Update Knowledge Source
    DESC: |-
      Partially update mutable fields of an existing knowledge source such as name, description, tags, or source-specific
      configuration. Only the fields provided in the request body will be updated. Some changes (e.g., KnowledgeSourceTypes)
      may trigger asynchronous reprocessing of the underlying content. Fields omitted from the request remain unchanged.
      Immutable fields (id, type, status, url, createdAt, updatedAt) cannot be modified directly.

      ## Refresh ##

      To request reprocessing without changing fields, pass the query parameter `refresh=true`. When `refresh=true` is provided,
      the server will re-queue processing for this knowledge resource (transitioning the persisted status to `QUEUED`) and
      return 202 Accepted. This query parameter is idempotent while the resource is already QUEUED or PROCESSING.
    HTTP:
      METHOD: PATCH
      ENDPOINT: /v2/KnowledgeBases/{kbId}/Knowledge/{knowledgeId}
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(KnowledgeCore)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - kbId:
          TYPE: STRING
          LOCATION: path
      - knowledgeId:
          TYPE: STRING
          LOCATION: path
      - refresh:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
      - body:
          TYPE: STRUCT(KnowledgeCore)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(Knowledge)
        RETURNVAR: twilio_knowledge_knowledgebas_knowledge_update
        STATUS: 200
      - RETURNTYPE: STRUCT(api.knowledgebas.knowledge.updateResponse202)
        RETURNVAR: twilio_knowledge_knowledgebas_knowledge_update_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_knowledge.knowledgebas.knowledge.update
  twilio_knowledge.knowledgebas.knowledge.delete:
    SUMMARY: Delete Knowledge Source
    DESC: Permanently delete knowledge source and all its associated data, including  processed chunks and embeddings. This action cannot be undone. The knowledge  resource will no longer be available for search or retrieval operations.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v2/KnowledgeBases/{kbId}/Knowledge/{knowledgeId}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - kbId:
          TYPE: STRING
          LOCATION: path
      - knowledgeId:
