      type: STRING
      REQUIRED: false
      comment: The SID of the [Sync Service](https://www.twilio.com/docs/sync/api/service) the resource is associated with.
    - name: document_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Sync Document to which the Document Permission applies.
    - name: identity
      type: STRING
      REQUIRED: false
      comment: The application-defined string that uniquely identifies the resource's User within the Service to an FPA token.
    - name: read
      type: BOOL
      REQUIRED: false
      comment: Whether the identity can read the Sync Document.
    - name: write
      type: BOOL
      REQUIRED: false
      comment: Whether the identity can update the Sync Document.
    - name: manage
      type: BOOL
      REQUIRED: false
      comment: Whether the identity can delete the Sync Document.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Sync Document Permission resource.
