VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://chat.twilio.com
METHODS:
  twilio_chat.service.channels.create:
    SUMMARY: Update a specific Channel.
    DESC: Update a specific Channel.
    HTTP:
      METHOD: POST
      ENDPOINT: /v3/Services/{ServiceSid}/Channels/{Sid}
      HEADERS:
        Content-Type: application/x-www-form-urlencoded
        Authorization: basic_auth
      CONTENT_TYPE: application/x-www-form-urlencoded
      ACCEPT: application/json
      BODYTYPE: x-www-form-urlencoded
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - ServiceSid:
          TYPE: STRING
          LOCATION: path
      - Sid:
          TYPE: STRING
          LOCATION: path
      - X-Twilio-Webhook-Enabled:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - Type:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - MessagingServiceSid:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(chat.v3.channel)
        RETURNVAR: twilio_chat_service_channels_create
        STATUS: 200
    CANONICAL_ID: twilio_chat.service.channels.create
STRUCTS:
  chat.v3.channel:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Channel resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Channel resource.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Service](https://www.twilio.com/docs/chat/rest/service-resource) the Channel resource is associated with.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: unique_name
      type: STRING
      REQUIRED: false
      comment: An application-defined string that uniquely identifies the resource. It can be used to address the resource in place of the resource's `sid` in the URL.
    - name: attributes
      type: STRING
      REQUIRED: false
      comment: The JSON string that stores application-specific data. If attributes have not been set, `{}` is returned.
    - name: type
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: created_by
      type: STRING
      REQUIRED: false
      comment: The `identity` of the User that created the channel. If the Channel was created by using the API, the value is `system`.
    - name: members_count
      type: INT
      REQUIRED: false
      comment: The number of Members in the Channel.
    - name: messages_count
      type: INT
      REQUIRED: false
      comment: The number of Messages that have been passed in the Channel.
    - name: messaging_service_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Messaging Service](https://www.twilio.com/docs/messaging/api/service-resource) this channel belongs to.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Channel resource.
