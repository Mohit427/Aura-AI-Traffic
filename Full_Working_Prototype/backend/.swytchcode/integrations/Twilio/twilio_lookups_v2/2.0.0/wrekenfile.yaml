      REQUIRED: false
      comment: HTTP response status code
  FetchLookupRateLimit_Error404:
    - name: code
      type: INT
      REQUIRED: false
      comment: Twilio-specific error code
    - name: message
      type: STRING
      REQUIRED: false
      comment: Error message
    - name: more_info
      type: STRING
      REQUIRED: false
      comment: Link to Error Code References
    - name: status
      type: INT
      REQUIRED: false
      comment: HTTP response status code
  DeleteLookupRateLimit_Error400:
    - name: code
      type: INT
      REQUIRED: false
      comment: Twilio-specific error code
    - name: message
      type: STRING
      REQUIRED: false
      comment: Error message
    - name: more_info
      type: STRING
      REQUIRED: false
      comment: Link to Error Code References
    - name: status
      type: INT
      REQUIRED: false
      comment: HTTP response status code
  UpdateLookupRateLimit_Error400:
    - name: code
      type: INT
      REQUIRED: false
      comment: Twilio-specific error code
    - name: message
      type: STRING
      REQUIRED: false
      comment: Error message
    - name: more_info
      type: STRING
      REQUIRED: false
      comment: Link to Error Code References
    - name: status
      type: INT
      REQUIRED: false
      comment: HTTP response status code
  FetchLookupPhoneNumberOverrides_Error400:
