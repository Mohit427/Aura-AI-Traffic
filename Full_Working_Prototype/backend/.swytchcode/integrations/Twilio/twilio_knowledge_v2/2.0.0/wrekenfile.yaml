    CANONICAL_ID: twilio_knowledge.knowledgebas.knowledge.delete
  twilio_knowledge.knowledgebas.chunks.get:
    SUMMARY: List Knowledge Chunks
    DESC: Retrieve a paginated list of all processed content chunks from a specific knowledge source.  Chunks are smaller segments of content that have been extracted and processed from the original  knowledge source. Each chunk contains content text and associated metadata that can be used  for semantic search and retrieval operations.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/KnowledgeBases/{kbId}/Knowledge/{knowledgeId}/Chunks
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
