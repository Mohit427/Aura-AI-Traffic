STRUCTS:
  events.v1.event_type:
    - name: type
      type: STRING
      REQUIRED: false
      comment: A string that uniquely identifies this Event Type.
    - name: schema_id
      type: STRING
      REQUIRED: false
      comment: A string that uniquely identifies the Schema this Event Type adheres to.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Event Type was created, given in ISO 8601 format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Event Type was updated, given in ISO 8601 format.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A human readable description for this Event Type.
    - name: status
      type: STRING
      REQUIRED: false
      comment: "A string that describes how this Event Type can be used. For example: `available`, `deprecated`, `restricted`, `discontinued`. When the status is `available`, the Event Type can be used normally."
    - name: documentation_url
      type: STRING
      REQUIRED: false
      comment: The URL to the documentation or to the most relevant Twilio Changelog entry of this Event Type.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
    - name: links
      type: OBJECT
      REQUIRED: false
  events.v1.schema:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The unique identifier of the schema. Each schema can have multiple versions, that share the same id.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: Contains a dictionary of URL links to nested resources of this schema.
    - name: latest_version_date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that the latest schema version was created, given in ISO 8601 format.
    - name: latest_version
      type: INT
      REQUIRED: false
      comment: The latest version published of this schema.
  events.v1.schema.schema_version:
    - name: id
      type: STRING
      REQUIRED: false
      comment: The unique identifier of the schema. Each schema can have multiple versions, that share the same id.
    - name: schema_version
      type: INT
      REQUIRED: false
      comment: The version of this schema.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date the schema version was created, given in ISO 8601 format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
    - name: raw
      type: STRING
      REQUIRED: false
  events.v1.sink:
