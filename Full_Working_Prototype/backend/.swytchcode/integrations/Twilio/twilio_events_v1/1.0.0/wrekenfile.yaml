    - name: sink_configuration
      type: ANY
      REQUIRED: false
      comment: The information required for Twilio to connect to the provided Sink encoded as JSON.
    - name: sink_type
      type: STRING
      REQUIRED: false
    - name: status
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
