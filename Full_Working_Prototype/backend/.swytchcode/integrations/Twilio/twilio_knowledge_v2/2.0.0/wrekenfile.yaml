STRUCTS:
  KnowledgeMeta:
    - name: key
      type: STRING
      REQUIRED: false
      comment: |
        The key of the list property contains the actual data items.
        This enables programmatic iteration over paginated results.
    - name: pageSize
      type: INT
      REQUIRED: false
    - name: nextToken
      type: STRING
      REQUIRED: false
    - name: previousToken
      type: STRING
      REQUIRED: false
  KnowledgeCore:
    - name: name
      type: STRING
      REQUIRED: true
      comment: The name of the knowledge source.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A detailed description of the knowledge source and when to use it.  This helps provide context about the content and its intended purpose.
    - name: source
      type: OBJECT
      REQUIRED: false
  Knowledge:
    - name: name
      type: STRING
      REQUIRED: true
      comment: The name of the knowledge source.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A detailed description of the knowledge source and when to use it.  This helps provide context about the content and its intended purpose.
    - name: source
      type: OBJECT
      REQUIRED: false
    - name: id
      type: STRING
      REQUIRED: true
    - name: status
      type: STRING
      REQUIRED: true
      comment: The status of processing the knowledge source ('SCHEDULED', 'QUEUED', 'PROCESSING', 'COMPLETED', 'FAILED').
    - name: createdAt
      type: TIMESTAMP
      REQUIRED: true
      comment: The date and time in GMT when the Knowledge was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: updatedAt
      type: TIMESTAMP
      REQUIRED: true
      comment: The date and time in GMT when the Knowledge was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
  KnowledgeChunk:
    - name: content
      type: STRING
      REQUIRED: false
      comment: The chunk content.
    - name: createdAt
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        The date and time in GMT when the Chunk was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
        format.
  KnowledgeSearch:
    - name: query
      type: STRING
      REQUIRED: true
      comment: The query to search the knowledge source.
    - name: top
      type: INT
      REQUIRED: true
      comment: The top K results to return.
    - name: knowledgeIds
      type: "[]STRING"
      REQUIRED: false
      comment: The list of knowledge IDs to search.
  KnowledgeChunkResult:
    - name: content
      type: STRING
      REQUIRED: false
      comment: The chunk content.
    - name: createdAt
      type: TIMESTAMP
      REQUIRED: false
      comment: |-
        The date and time in GMT when the Chunk was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
        format.
    - name: score
      type: FLOAT
      REQUIRED: false
      comment: The score associated with the chunk.
    - name: knowledgeId
      type: STRING
      REQUIRED: false
  TwilioError:
    - name: code
      type: INT
      REQUIRED: false
      comment: The Twilio error code.
