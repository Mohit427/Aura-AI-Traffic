    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Service.
    - name: entity_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Entity.
    - name: identity
      type: STRING
      REQUIRED: false
      comment: Customer unique identity for the Entity owner of the Factor. This identifier should be immutable, not PII, length between 8 and 64 characters, and generated by your external system, such as your user's UUID, GUID, or SID. It can only contain dash (-) separated alphanumeric characters.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Factor was created, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Factor was updated, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human readable description of this resource, up to 64 characters. For a push factor, this can be the device's name.
    - name: status
      type: STRING
      REQUIRED: false
    - name: factor_type
      type: STRING
      REQUIRED: false
    - name: config
      type: ANY
      REQUIRED: false
      comment: An object that contains configurations specific to a `factor_type`.
    - name: metadata
      type: ANY
      REQUIRED: false
      comment: "Custom metadata associated with the factor. This is added by the Device/SDK directly to allow for the inclusion of device information. It must be a stringified JSON with only strings values eg. `{\"os\": \"Android\"}`. Can be up to 1024 characters in length."
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
  verify.v2.form:
    - name: form_type
      type: STRING
      REQUIRED: false
    - name: forms
      type: ANY
      REQUIRED: false
      comment: Object that contains the available forms for this type. This available forms are given in the standard [JSON Schema](https://json-schema.org/) format
    - name: form_meta
      type: ANY
      REQUIRED: false
      comment: Additional information for the available forms for this type. E.g. The separator string used for `binding` in a Factor push.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL to access the forms for this type.
  verify.v2.service.messaging_configuration:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Service resource.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Service](https://www.twilio.com/docs/verify/api/service) that the resource is associated with.
    - name: country
      type: STRING
      REQUIRED: false
      comment: The [ISO-3166-1](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code of the country this configuration will be applied to. If this is a global configuration, Country will take the value `all`.
    - name: messaging_service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Messaging Service](https://www.twilio.com/docs/messaging/api/service-resource) to be used to send SMS to the country of this configuration.
    - name: date_created
