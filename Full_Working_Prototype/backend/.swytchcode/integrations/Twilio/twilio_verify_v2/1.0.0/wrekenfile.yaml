    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
  verify.v2.service.entity.new_factor:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Factor.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Service.
    - name: entity_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Entity.
    - name: identity
      type: STRING
      REQUIRED: false
      comment: Customer unique identity for the Entity owner of the Factor. This identifier should be immutable, not PII, length between 8 and 64 characters, and generated by your external system, such as your user's UUID, GUID, or SID. It can only contain dash (-) separated alphanumeric characters.
    - name: binding
      type: ANY
      REQUIRED: false
      comment: |-
        Contains the `factor_type` specific secret and metadata.
        For push, this is `binding.public_key` and `binding.alg`.
        For totp, this is `binding.secret` and `binding.uri`. The `binding.uri` property is generated following the [google authenticator key URI format](https://github.com/google/google-authenticator/wiki/Key-Uri-Format), and `Factor.friendly_name` is used for the “accountname” value and `Service.friendly_name` or `Service.totp.issuer` is used for the `issuer` value.

        The Binding property is ONLY returned upon Factor creation.
    - name: options
      type: ANY
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Factor was created, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Factor was updated, given in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: |-
        The friendly name of this Factor. This can be any string up to 64 characters, meant for humans to distinguish between Factors.
        For `factor_type` `push`, this could be a device name.
        For `factor_type` `totp`, this value is used as the “account name” in constructing the `binding.uri` property.
        At the same time, we recommend avoiding providing PII.
    - name: status
      type: STRING
      REQUIRED: false
    - name: factor_type
      type: STRING
      REQUIRED: false
    - name: config
      type: ANY
      REQUIRED: false
      comment: An object that contains configurations specific to a `factor_type`.
    - name: metadata
      type: ANY
      REQUIRED: false
