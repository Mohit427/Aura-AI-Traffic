VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://frontline-api.twilio.com
METHODS:
  twilio_frontline.user.get:
    SUMMARY: Fetch a frontline user
    DESC: Fetch a frontline user
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Users/{Sid}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(frontline.v1.user)
        RETURNVAR: twilio_frontline_user_get
        STATUS: 200
    CANONICAL_ID: twilio_frontline.user.get
  twilio_frontline.user.create:
    SUMMARY: Update an existing frontline user
    DESC: Update an existing frontline user
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/Users/{Sid}
      HEADERS:
        Content-Type: application/x-www-form-urlencoded
        Authorization: basic_auth
      CONTENT_TYPE: application/x-www-form-urlencoded
      ACCEPT: application/json
      BODYTYPE: x-www-form-urlencoded
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
      - FriendlyName:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - Avatar:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - State:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - IsAvailable:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(frontline.v1.user)
        RETURNVAR: twilio_frontline_user_create
        STATUS: 200
    CANONICAL_ID: twilio_frontline.user.create
STRUCTS:
  frontline.v1.user:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the User resource.
    - name: identity
      type: STRING
      REQUIRED: false
      comment: The application-defined string that uniquely identifies the resource's User. This value is often a username or an email address, and is case-sensitive.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the User.
    - name: avatar
      type: STRING
      REQUIRED: false
      comment: The avatar URL which will be shown in Frontline application.
    - name: state
      type: STRING
      REQUIRED: false
    - name: is_available
      type: BOOL
      REQUIRED: false
      comment: Whether the User is available for new conversations. Defaults to `false` for new users.
    - name: url
      type: STRING
      REQUIRED: false
      comment: An absolute API resource URL for this user.
