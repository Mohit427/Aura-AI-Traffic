STRUCTS:
  numbers.v2.authorization_document:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this AuthorizationDocument.
    - name: address_sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies the Address resource that is associated with this AuthorizationDocument.
    - name: status
      type: STRING
      REQUIRED: false
    - name: email
      type: STRING
      REQUIRED: false
      comment: Email that this AuthorizationDocument will be sent to for signing.
    - name: cc_emails
      type: "[]STRING"
      REQUIRED: false
      comment: Email recipients who will be informed when an Authorization Document has been sent and signed.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date this resource was created, given as [GMT RFC 2822](http://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was updated, given as [GMT RFC 2822](http://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
    - name: links
      type: OBJECT
      REQUIRED: false
  numbers.v2.bulk_hosted_number_order:
    - name: bulk_hosting_sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this BulkHostedNumberOrder.
    - name: request_status
      type: STRING
      REQUIRED: false
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A 128 character string that is a human-readable text that describes this resource.
    - name: notification_email
      type: STRING
      REQUIRED: false
      comment: Email address used for send notifications about this Bulk hosted number request.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date this resource was created, given as [GMT RFC 2822](http://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_completed
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was completed, given as [GMT RFC 2822](http://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this BulkHostedNumberOrder resource.
    - name: total_count
      type: INT
      REQUIRED: false
      comment: The total count of phone numbers in this Bulk hosting request.
    - name: results
      type: "[]ANY"
      REQUIRED: false
      comment: Contains a list of all the individual hosting orders and their information, for this Bulk request. Each result object is grouped by its order status. To see a complete list of order status, please check 'https://www.twilio.com/docs/phone-numbers/hosted-numbers/hosted-numbers-api/hosted-number-order-resource#status-values'.
  numbers.v2.regulatory_compliance.bundle:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Bundle resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Bundle resource.
    - name: regulation_sid
      type: STRING
      REQUIRED: false
      comment: The unique string of a regulation that is associated to the Bundle resource.
    - name: friendly_name
