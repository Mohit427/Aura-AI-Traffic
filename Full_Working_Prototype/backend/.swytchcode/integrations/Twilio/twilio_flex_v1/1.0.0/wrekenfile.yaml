STRUCTS:
  flex.v1.channel:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Channel resource and owns this Workflow.
    - name: flex_flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flex Flow.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Channel resource.
    - name: user_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the chat user.
    - name: task_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the TaskRouter Task. Only valid when integration type is `task`. `null` for integration types `studio` & `external`
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Flex chat channel resource.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the Flex chat channel was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the Flex chat channel was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
  flex.v1.configuration:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Configuration resource.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the Configuration resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the Configuration resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: attributes
      type: ANY
      REQUIRED: false
      comment: An object that contains application-specific data.
    - name: status
      type: STRING
      REQUIRED: false
    - name: taskrouter_workspace_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the TaskRouter Workspace.
    - name: taskrouter_target_workflow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the TaskRouter target Workflow.
    - name: taskrouter_target_taskqueue_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the TaskRouter Target TaskQueue.
    - name: taskrouter_taskqueues
      type: "[]ANY"
      REQUIRED: false
      comment: The list of TaskRouter TaskQueues.
    - name: taskrouter_skills
      type: "[]ANY"
      REQUIRED: false
      comment: The Skill description for TaskRouter workers.
    - name: taskrouter_worker_channels
      type: ANY
      REQUIRED: false
      comment: The TaskRouter default channel capacities and availability for workers.
    - name: taskrouter_worker_attributes
      type: ANY
      REQUIRED: false
      comment: The TaskRouter Worker attributes.
    - name: taskrouter_offline_activity_sid
      type: STRING
      REQUIRED: false
      comment: The TaskRouter SID of the offline activity.
    - name: runtime_domain
      type: STRING
      REQUIRED: false
      comment: The URL where the Flex instance is hosted.
    - name: messaging_service_instance_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Messaging service instance.
    - name: chat_service_instance_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the chat service this user belongs to.
    - name: flex_service_instance_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flex service instance.
    - name: flex_instance_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flex instance.
    - name: ui_language
      type: STRING
      REQUIRED: false
      comment: The primary language of the Flex UI.
    - name: ui_attributes
      type: ANY
      REQUIRED: false
      comment: The object that describes Flex UI characteristics and settings.
    - name: ui_dependencies
      type: ANY
      REQUIRED: false
      comment: The object that defines the NPM packages and versions to be used in Hosted Flex.
    - name: ui_version
