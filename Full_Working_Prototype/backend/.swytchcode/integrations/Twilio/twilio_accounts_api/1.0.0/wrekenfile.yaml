STRUCTS:
  accounts.v1.auth_token_promotion:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that the secondary Auth Token was created for.
    - name: auth_token
      type: STRING
      REQUIRED: false
      comment: The promoted Auth Token that must be used to authenticate future API requests.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in UTC when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URI for this resource, relative to `https://accounts.twilio.com`
  accounts.v1.bulk_consents:
    - name: items
      type: ANY
      REQUIRED: false
      comment: "A list of objects where each object represents the result of processing a `correlation_id`. Each object contains the following fields: `correlation_id`, a unique 32-character UUID that maps the response to the original request; `error_code`, an integer where 0 indicates success and any non-zero value represents an error; and `error_messages`, an array of strings describing specific validation errors encountered. If the request is successful, the error_messages array will be empty."
  accounts.v1.bulk_contacts:
    - name: items
      type: ANY
      REQUIRED: false
      comment: "A list of objects where each object represents the result of processing a `correlation_id`. Each object contains the following fields: `correlation_id`, a unique 32-character UUID that maps the response to the original request; `error_code`, an integer where 0 indicates success and any non-zero value represents an error; and `error_messages`, an array of strings describing specific validation errors encountered. If the request is successful, the error_messages array will be empty."
  accounts.v1.credential.credential_aws:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the AWS resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the AWS resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URI for this resource, relative to `https://accounts.twilio.com`
  accounts.v1.credential.credential_public_key:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that that we created to identify the PublicKey resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Credential that the PublicKey resource belongs to.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URI for this resource, relative to `https://accounts.twilio.com`
  accounts.v1.messaging_geopermissions:
    - name: permissions
      type: ANY
      REQUIRED: false
      comment: "A list of objects where each object represents the result of processing a messaging Geo Permission. Each object contains the following fields: `country_code`, the country code of the country for which the permission was updated; `type`, the type of the permission i.e. country; `enabled`, true if the permission is enabled else false; `error_code`, an integer where 0 indicates success and any non-zero value represents an error; and `error_messages`, an array of strings describing specific validation errors encountered. If the request is successful, the error_messages array will be empty."
  accounts.v1.safelist:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the SafeList resource.
    - name: phone_number
      type: STRING
      REQUIRED: false
      comment: The phone number or phone number 1k prefix in SafeList.
  accounts.v1.secondary_auth_token:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that the secondary Auth Token was created for.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in UTC when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in UTC when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: secondary_auth_token
      type: STRING
      REQUIRED: false
      comment: The generated secondary Auth Token that can be used to authenticate future API requests.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URI for this resource, relative to `https://accounts.twilio.com`
  api.credential.aWS.listResponse200:
    - name: credentials
      type: "[]STRUCT(accounts.v1.credential.credential_aws)"
