    - name: max_concurrent_participants
      type: INT
      REQUIRED: false
      comment: Actual maximum number of concurrent participants in the conference.
    - name: unique_participants
      type: INT
      REQUIRED: false
      comment: Unique conference participants based on caller ID.
    - name: end_reason
      type: STRING
      REQUIRED: false
