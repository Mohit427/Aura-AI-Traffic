    - name: enforceUnique
      type: BOOL
      REQUIRED: false
      comment: |-
        When enabled, more than one profile may not share the same identifier value.
        Adding a shared identifier to a second profile may trigger a merge.
        Disabling creates a compound identifier where merges are only triggered if
        two or more identifiers satisfy a matching rule.
    - name: normalization
      type: STRING
      REQUIRED: false
      comment: |-
        Normalization to apply to the identifier value before storing and matching.
        - `phone`: Normalize phone numbers to E.164 format.
        - `email`: Normalize email addresses by coverting to lowercase and removing spaces.
        - `trim`: Removes spaces from both ends of the string.
        - `none`: No normalization.

        **Important Note for Phone Number Normalization:**
        When using the `phone` normalization option, please adhere to the following guidelines to ensure proper formatting:
        - All US numbers must be at least valid 10 digit phone numbers with area code. They may also include or omit the "+1" prefix.
        - Non-US numbers must include a 1-3 digit country code (a "+" prefix is optional). Non-US national formats are not supported and will be interpreted as US numbers.
  IdentityResolutionSettings:
    - name: identifierConfigs
      type: "[]STRUCT(IdentifierConfig)"
      REQUIRED: false
      comment: List of identifier types and their resolution settings.
    - name: matchingRules
      type: "[]STRING"
      REQUIRED: false
      comment: |-
        Priority list of identifiers to locate profiles to apply new data to, or for
        determining if two existing profiles should merge. Rules are evaluated in order.
        - If no rule matches against existing profiles, a new profile will be created.
        - If a rule matches to a single existing profile, the profile will be updated.
        - If a rule matches to multiple existing profiles, those existing profiles will be merged.
    - name: version
      type: INT
      REQUIRED: true
      comment: The current version number of the Identity Resolution Settings. Incremented on each successful update.
