STRUCTS:
  notify.v1.service.binding:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Binding resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Binding resource.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Service](https://www.twilio.com/docs/notify/api/service-resource) the resource is associated with.
    - name: credential_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Credential](https://www.twilio.com/docs/notify/api/credential-resource) resource to be used to send notifications to this Binding. If present, this overrides the Credential specified in the Service resource. Applicable only to `apn`, `fcm`, and `gcm` type Bindings.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: notification_protocol_version
      type: STRING
      REQUIRED: false
      comment: The protocol version to use to send the notification. This defaults to the value of `default_xxxx_notification_protocol_version` in the [Service](https://www.twilio.com/docs/notify/api/service-resource) for the protocol. The current version is `"3"` for `apn`, `fcm`, and `gcm` type Bindings. The parameter is not applicable to `sms` and `facebook-messenger` type Bindings as the data format is fixed.
    - name: endpoint
      type: STRING
      REQUIRED: false
      comment: Deprecated.
    - name: identity
      type: STRING
      REQUIRED: false
      comment: The `identity` value that uniquely identifies the resource's [User](https://www.twilio.com/docs/chat/rest/user-resource) within the [Service](https://www.twilio.com/docs/notify/api/service-resource). Up to 20 Bindings can be created for the same Identity in a given Service.
    - name: binding_type
      type: STRING
      REQUIRED: false
      comment: "The transport technology to use for the Binding. Can be: `apn`, `fcm`, `gcm`, `sms`, or `facebook-messenger`."
    - name: address
      type: STRING
      REQUIRED: false
      comment: The channel-specific address. For APNS, the device token. For FCM and GCM, the registration token. For SMS, a phone number in E.164 format. For Facebook Messenger, the Messenger ID of the user or a phone number in E.164 format.
    - name: tags
      type: "[]STRING"
      REQUIRED: false
      comment: The list of tags associated with this Binding. Tags can be used to select the Bindings to use when sending a notification. Maximum 20 tags are allowed.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Binding resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URLs of related resources.
  notify.v1.credential:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Credential resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Credential resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: type
      type: STRING
      REQUIRED: false
    - name: sandbox
      type: STRING
      REQUIRED: false
      comment: "[APN only] Whether to send the credential to sandbox APNs. Can be `true` to send to sandbox APNs or `false` to send to production."
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Credential resource.
  notify.v1.service.notification:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Notification resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Notification resource.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Service](https://www.twilio.com/docs/notify/api/service-resource) the resource is associated with.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: identities
      type: "[]STRING"
      REQUIRED: false
      comment: The list of `identity` values of the Users to notify. We will attempt to deliver notifications only to Bindings with an identity in this list.
    - name: tags
      type: "[]STRING"
      REQUIRED: false
      comment: The tags that select the Bindings to notify. Notifications will be attempted only to Bindings that have all of the tags listed in this property.
    - name: segments
      type: "[]STRING"
      REQUIRED: false
      comment: The list of Segments to notify. The [Segment](https://www.twilio.com/docs/notify/api/segment-resource) resource is deprecated. Use the `tags` property, instead.
    - name: priority
      type: STRING
      REQUIRED: false
    - name: ttl
      type: INT
      REQUIRED: false
      comment: How long, in seconds, the notification is valid. Can be an integer between 0 and 2,419,200, which is 4 weeks, the default and the maximum supported time to live (TTL). Delivery should be attempted if the device is offline until the TTL elapses. Zero means that the notification delivery is attempted immediately, only once, and is not stored for future delivery. SMS does not support this property.
    - name: title
      type: STRING
      REQUIRED: false
      comment: The notification title. For FCM and GCM, this translates to the `data.twi_title` value. For APNS, this translates to the `aps.alert.title` value. SMS does not support this property. This field is not visible on iOS phones and tablets but appears on Apple Watch and Android devices.
    - name: body
      type: STRING
      REQUIRED: false
      comment: The notification text. For FCM and GCM, translates to `data.twi_body`. For APNS, translates to `aps.alert.body`. For SMS, translates to `body`. SMS requires either this `body` value, or `media_urls` attribute defined in the `sms` parameter of the notification.
    - name: sound
      type: STRING
      REQUIRED: false
      comment: The name of the sound to be played for the notification. For FCM and GCM, this Translates to `data.twi_sound`.  For APNS, this translates to `aps.sound`.  SMS does not support this property.
    - name: action
      type: STRING
      REQUIRED: false
      comment: The actions to display for the notification. For APNS, translates to the `aps.category` value. For GCM, translates to the `data.twi_action` value. For SMS, this parameter is not supported and is omitted from deliveries to those channels.
    - name: data
      type: ANY
      REQUIRED: false
      comment: The custom key-value pairs of the notification's payload. For FCM and GCM, this value translates to `data` in the FCM and GCM payloads. FCM and GCM [reserve certain keys](https://firebase.google.com/docs/cloud-messaging/http-server-ref) that cannot be used in those channels. For APNS, attributes of `data` are inserted into the APNS payload as custom properties outside of the `aps` dictionary. In all channels, we reserve keys that start with `twi_` for future use. Custom keys that start with `twi_` are not allowed and are rejected as 400 Bad request with no delivery attempted. For SMS, this parameter is not supported and is omitted from deliveries to those channels.
    - name: apn
      type: ANY
      REQUIRED: false
      comment: The APNS-specific payload that overrides corresponding attributes in the generic payload for APNS Bindings. This property maps to the APNS `Payload` item, therefore the `aps` key must be used to change standard attributes. Adds custom key-value pairs to the root of the dictionary. See the [APNS documentation](https://developer.apple.com/library/content/documentation/NetworkingInternet/Conceptual/RemoteNotificationsPG/CommunicatingwithAPNs.html) for more details. We reserve keys that start with `twi_` for future use. Custom keys that start with `twi_` are not allowed.
    - name: gcm
      type: ANY
