STRUCTS:
  OperatorResultsResponseV1:
    - name: outputFormat
      type: STRING
      REQUIRED: true
    - name: variant_TextResult
      type: STRUCT(TextResult)
      REQUIRED: false
    - name: variant_JSONResult
      type: STRUCT(JSONResult)
      REQUIRED: false
    - name: variant_ClassificationResult
      type: STRUCT(ClassificationResult)
      REQUIRED: false
    - name: variant_ExtractionResult
      type: STRUCT(ExtractionResult)
      REQUIRED: false
  TextResult:
    - name: outputFormat
      type: STRING
      REQUIRED: true
    - name: id
      type: STRING
      REQUIRED: true
      comment: A unique identifier for the Operator Result. Assigned by Twilio (TTID).
    - name: accountId
      type: STRING
      REQUIRED: true
      comment: The ID of the Account that created the Language Operator.
    - name: intelligenceConfiguration
      type: STRUCT(IntelligenceConfigurationReference)
      REQUIRED: true
    - name: conversationId
      type: STRING
      REQUIRED: true
      comment: The `id` of the Conversation attached to the Operator Result.
    - name: operator
      type: STRUCT(OperatorReference)
      REQUIRED: true
    - name: dateCreated
      type: TIMESTAMP
      REQUIRED: true
      comment: Timestamp for when the Operator Result was created.
    - name: referenceIds
      type: "[]STRING"
      REQUIRED: true
      comment: The `id`s of objects related to this Operator Result.
    - name: executionDetails
      type: STRUCT(ExecutionDetails)
      REQUIRED: true
    - name: metadata
      type: OBJECT
      REQUIRED: true
    - name: result
      type: OBJECT
      REQUIRED: true
      comment: The actual result from executing the Language Operator with `TEXT` output format.
  IntelligenceConfigurationReference:
    - name: id
      type: STRING
      REQUIRED: true
      comment: Unique identifier for a Intelligence Configuration that generated the Operator Result. Assigned by Twilio (TTID).
    - name: ruleId
      type: STRING
      REQUIRED: true
      comment: Unique identifier of the rule of the Intelligence Configuration that triggered the result. Assigned by Twilio (TTID).
    - name: version
      type: INT
      REQUIRED: true
      comment: Version of the Intelligence Configuration used to generate the Operator Result.
  OperatorReference:
    - name: id
      type: STRING
      REQUIRED: true
      comment: The `id` of the Language Operator.
    - name: version
      type: INT
      REQUIRED: true
      comment: Version of the Language Operator used to generate the Operator Result.
    - name: parameters
      type: map[STRING]ANY
      REQUIRED: true
      comment: Parameter values used for Operator execution, provided by the Rule at runtime. This object contains a dictionary of parameter keys and their corresponding values.
  ExecutionDetails:
    - name: trigger
      type: OBJECT
      REQUIRED: true
      comment: Metadata for the trigger that generated this Operator Result.
    - name: communications
      type: OBJECT
      REQUIRED: true
      comment: Range of first and last communications in the Conversation that were processed during this Operator execution.
    - name: channels
      type: "[]STRING"
      REQUIRED: true
      comment: Communication channels included in the Conversation when this Operator was executed.
    - name: participants
      type: "[]ANY"
      REQUIRED: true
      comment: Metadata for the participants included in the Conversation when this Operator executed.
    - name: resolvedContext
      type: STRUCT(ResolvedContext)
      REQUIRED: false
  ResolvedContext:
    - name: memory
      type: OBJECT
      REQUIRED: false
      comment: |
        The customer profile that was accessed. null if no memory was accessed.

        Either observations and/or traits from the profile were used by the LLM to generate the result.
    - name: knowledge
      type: OBJECT
      REQUIRED: false
      comment: |
        Knowledge source IDs with their respective knowledge base ID that was accessed and used by the LLM to generate the result.

        null if no knowledge was accessed.
  JSONResult:
    - name: outputFormat
