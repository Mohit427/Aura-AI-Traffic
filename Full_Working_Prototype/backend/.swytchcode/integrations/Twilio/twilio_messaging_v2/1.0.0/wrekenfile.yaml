VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://messaging.twilio.com
METHODS:
  twilio_messaging.indicator.typing.create:
    SUMMARY: Send a typing indicator
    DESC: |
      Send a typing indicator to notify the recipient that you are composing a message. Currently supported for whatsapp channel only. For WhatsApp, `messageId` is required.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/Indicators/Typing.json
      HEADERS:
        Content-Type: application/x-www-form-urlencoded
        Authorization: basic_auth
      CONTENT_TYPE: application/x-www-form-urlencoded
      ACCEPT: application/json
      BODYTYPE: x-www-form-urlencoded
    EXECUTION:
      KIND: http
      MODE: sync
    RETURNS:
      - RETURNTYPE: STRUCT(api.indicator.typing.createResponse200)
        RETURNVAR: twilio_messaging_indicator_typing_create
        STATUS: 200
    CANONICAL_ID: twilio_messaging.indicator.typing.create
  twilio_messaging.channel.senders.create:
    SUMMARY: Create a Sender
    DESC: Create a Sender.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/Channels/Senders
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(messaging.v2.channels_sender.requests.create)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(messaging.v2.channels_sender.requests.create)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(messaging.v2.channels_sender_response)
        RETURNVAR: twilio_messaging_channel_senders_create_202
        STATUS: 202
    CANONICAL_ID: twilio_messaging.channel.senders.create
  twilio_messaging.channel.senders.list:
    SUMMARY: Retrieve a list of Senders
    DESC: Retrieve a list of Senders for an account.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/Channels/Senders
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Channel:
          TYPE: STRING
          LOCATION: query
      - PageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 50
      - Page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - PageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.channel.senders.listResponse200)
        RETURNVAR: twilio_messaging_channel_senders_list
        STATUS: 200
    CANONICAL_ID: twilio_messaging.channel.senders.list
  twilio_messaging.channel.senders.get:
    SUMMARY: Retrieve a Sender
    DESC: Retrieve a Sender.
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/Channels/Senders/{Sid}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(messaging.v2.channels_sender_response)
        RETURNVAR: twilio_messaging_channel_senders_get
        STATUS: 200
    CANONICAL_ID: twilio_messaging.channel.senders.get
  twilio_messaging.channel.senders.create.1:
    SUMMARY: Update a sender's information, including `profile`, `webhook`, and `configuration`.
    DESC: (WhatsApp only) Update a Sender. You can update a sender's information, including `profile`, `webhook`, and `configuration`. To verify a phone number, set `configuration.verification_code` to the One-time Password (OTP) that you received.
    HTTP:
      METHOD: POST
      ENDPOINT: /v2/Channels/Senders/{Sid}
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(messaging.v2.channels_sender.requests.update)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(messaging.v2.channels_sender.requests.update)
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(messaging.v2.channels_sender_response)
        RETURNVAR: twilio_messaging_channel_senders_create_1_202
        STATUS: 202
    CANONICAL_ID: twilio_messaging.channel.senders.create.1
  twilio_messaging.channel.senders.delete:
    SUMMARY: Delete a Sender
    DESC: (WhatsApp only) Delete a Sender.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v2/Channels/Senders/{Sid}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    CANONICAL_ID: twilio_messaging.channel.senders.delete
  twilio_messaging.linkshortening.certificate.get:
    SUMMARY: Perform operation FetchDomainCertV4
    HTTP:
      METHOD: GET
      ENDPOINT: /v2/LinkShortening/Domains/{DomainSid}/Certificate
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - DomainSid:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(messaging.v2.domain_cert_v4)
        RETURNVAR: twilio_messaging_linkshortening_certificate_get
        STATUS: 200
    CANONICAL_ID: twilio_messaging.linkshortening.certificate.get
STRUCTS:
  messaging.v2.channels_sender_response:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The SID of the sender.
    - name: status
      type: STRING
      REQUIRED: false
    - name: sender_id
      type: STRING
      REQUIRED: false
    - name: configuration
      type: STRUCT(messaging.v2.channels_sender.configuration)
      REQUIRED: false
    - name: webhook
      type: STRUCT(messaging.v2.channels_sender.webhook)
      REQUIRED: false
    - name: profile
      type: STRUCT(messaging.v2.channels_sender.profile_generic_response)
      REQUIRED: false
    - name: properties
      type: STRUCT(messaging.v2.channels_sender.properties)
      REQUIRED: false
    - name: offline_reasons
      type: ANY
      REQUIRED: false
    - name: compliance
      type: STRUCT(messaging.v2.rcs_compliance_response)
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of the resource.
  messaging.v2.channels_sender.configuration:
    - name: waba_id
      type: STRING
      REQUIRED: false
      comment: The ID of the WhatsApp Business Account (WABA) to use for this sender.
    - name: verification_method
      type: STRING
      REQUIRED: false
      comment: The verification method.
    - name: verification_code
      type: STRING
      REQUIRED: false
      comment: The verification code.
    - name: voice_application_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Twilio Voice application.
    - name: account_type
      type: STRING
      REQUIRED: false
      comment: The account type for ISV Account Type Migration. Set to 'ISV' or 'ISVSubAccount' to configure, empty string to clear, or omit to preserve the existing value.
  messaging.v2.channels_sender.webhook:
    - name: callback_url
      type: STRING
      REQUIRED: false
      comment: The URL to send the webhook to.
    - name: callback_method
      type: STRING
      REQUIRED: false
      comment: The HTTP method for the webhook.
    - name: fallback_url
      type: STRING
      REQUIRED: false
      comment: The URL to send the fallback webhook to.
    - name: fallback_method
      type: STRING
      REQUIRED: false
      comment: The HTTP method for the fallback webhook.
    - name: status_callback_url
      type: STRING
      REQUIRED: false
      comment: The URL to send the status callback to.
    - name: status_callback_method
      type: STRING
      REQUIRED: false
      comment: The HTTP method for the status callback.
  messaging.v2.channels_sender.profile_generic_response:
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the sender.
    - name: about
      type: STRING
      REQUIRED: false
      comment: The profile about text for the sender.
    - name: address
      type: STRING
      REQUIRED: false
      comment: The address of the sender.
    - name: description
      type: STRING
      REQUIRED: false
      comment: The description of the sender.
    - name: logo_url
      type: STRING
      REQUIRED: false
      comment: The logo URL of the sender.
    - name: banner_url
      type: STRING
      REQUIRED: false
      comment: The banner URL of the sender.
    - name: privacy_url
      type: STRING
      REQUIRED: false
      comment: The privacy URL of the sender. Must be a publicly accessible HTTP or HTTPS URI associated with the sender.
    - name: terms_of_service_url
      type: STRING
      REQUIRED: false
      comment: The terms of service URL of the sender.
    - name: accent_color
      type: STRING
      REQUIRED: false
      comment: The color theme of the sender. Must be in hex format and have at least a 4:5:1 contrast ratio against white.
    - name: use_case
      type: STRING
      REQUIRED: false
      comment: The messaging use case type for the RCS sender. Allowed values are `PROMOTIONAL`, `TRANSACTIONAL`, `OTP`, `MULTI_USE`. Defaults to `MULTI_USE` if not provided. Cannot be modified after launch.
    - name: vertical
      type: STRING
      REQUIRED: false
      comment: |
        The vertical of the sender. Allowed values are:
        - `Alcohol`
        - `Automotive`
        - `Beauty, Spa and Salon`
        - `Clothing and Apparel`
        - `Education`
        - `Entertainment`
        - `Event Planning and Service`
        - `Finance and Banking`
        - `Food and Grocery`
        - `Hotel and Lodging`
        - `Matrimony Service`
        - `Medical and Health`
        - `Non-profit`
        - `Online Gambling`
        - `OTC Drugs`
        - `Other`
        - `Physical Gambling`
        - `Professional Services`
        - `Public Service`
        - `Restaurant`
        - `Shopping and Retail`
        - `Travel and Transportation`
    - name: websites
      type: "[]ANY"
      REQUIRED: false
      comment: The websites of the sender.
    - name: emails
      type: "[]ANY"
      REQUIRED: false
      comment: The emails of the sender.
    - name: phone_numbers
      type: "[]ANY"
      REQUIRED: false
      comment: The phone numbers of the sender.
  messaging.v2.channels_sender.properties:
    - name: quality_rating
      type: STRING
      REQUIRED: false
      comment: The quality rating of the sender.
    - name: messaging_limit
      type: STRING
      REQUIRED: false
      comment: The messaging limit of the sender.
  messaging.v2.rcs_compliance_response:
    - name: registration_sid
      type: STRING
      REQUIRED: true
      comment: |
        The default compliance registration SID (e.g., from CR-Google) that applies to all countries unless overridden in the `countries` array.
    - name: countries
      type: "[]STRUCT(messaging.v2.rcs_compliance_country_response)"
      REQUIRED: false
      comment: |
        A list of country-specific compliance details.
  messaging.v2.rcs_compliance_country_response:
    - name: country
      type: STRING
      REQUIRED: true
      comment: The ISO 3166-1 alpha-2 country code.
    - name: registration_sid
      type: STRING
      REQUIRED: false
      comment: |
        The default compliance registration SID (e.g., from CR-Google) that applies to all countries unless overridden in the `countries` array.
    - name: status
      type: STRING
      REQUIRED: false
    - name: carriers
      type: "[]STRUCT(messaging.v2.rcs_carrier)"
      REQUIRED: false
  messaging.v2.rcs_carrier:
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the carrier. For example, `Verizon` or `AT&T` for US.
    - name: status
      type: STRING
      REQUIRED: false
  messaging.v2.channels_sender.requests.create:
    - name: sender_id
      type: STRING
      REQUIRED: true
    - name: configuration
      type: STRUCT(messaging.v2.channels_sender.configuration)
      REQUIRED: false
    - name: webhook
      type: STRUCT(messaging.v2.channels_sender.webhook)
      REQUIRED: false
    - name: profile
      type: STRUCT(messaging.v2.channels_sender.profile)
      REQUIRED: false
  messaging.v2.channels_sender.profile:
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the sender. Required for WhatsApp senders and must follow [Meta's display name guidelines](https://www.facebook.com/business/help/757569725593362).
    - name: about
      type: STRING
      REQUIRED: false
      comment: The profile about text for the sender.
    - name: address
      type: STRING
      REQUIRED: false
      comment: The address of the sender.
    - name: description
      type: STRING
      REQUIRED: false
      comment: The description of the sender.
    - name: logo_url
      type: STRING
      REQUIRED: false
      comment: The logo URL of the sender.
    - name: banner_url
      type: STRING
      REQUIRED: false
      comment: The banner URL of the sender.
    - name: privacy_url
      type: STRING
      REQUIRED: false
      comment: |
        The privacy URL of the sender. Must be a publicly accessible HTTP or HTTPS URI associated with the sender.
    - name: terms_of_service_url
      type: STRING
      REQUIRED: false
      comment: The terms of service URL of the sender.
    - name: accent_color
      type: STRING
      REQUIRED: false
      comment: The color theme of the sender. Must be in hex format and have at least a 4:5:1 contrast ratio against white.
    - name: use_case
      type: STRING
      REQUIRED: false
      comment: The messaging use case type for the RCS sender. Allowed values are `PROMOTIONAL`, `TRANSACTIONAL`, `OTP`, `MULTI_USE`. Defaults to `MULTI_USE` if not provided. Cannot be modified after launch.
    - name: vertical
      type: STRING
      REQUIRED: false
      comment: |
        The vertical of the sender. Allowed values are:
        - `Alcohol`
        - `Automotive`
        - `Beauty, Spa and Salon`
        - `Clothing and Apparel`
        - `Education`
        - `Entertainment`
        - `Event Planning and Service`
        - `Finance and Banking`
        - `Food and Grocery`
        - `Hotel and Lodging`
        - `Matrimony Service`
        - `Medical and Health`
        - `Non-profit`
        - `Online Gambling`
        - `OTC Drugs`
        - `Other`
        - `Physical Gambling`
        - `Professional Services`
        - `Public Service`
        - `Restaurant`
        - `Shopping and Retail`
        - `Travel and Transportation`
    - name: websites
      type: ANY
      REQUIRED: false
      comment: The websites of the sender.
    - name: emails
      type: ANY
      REQUIRED: false
      comment: The emails of the sender.
    - name: phone_numbers
      type: ANY
      REQUIRED: false
      comment: The phone numbers of the sender.
  messaging.v2.channels_sender.requests.update:
    - name: configuration
      type: STRUCT(messaging.v2.channels_sender.configuration)
      REQUIRED: false
    - name: webhook
      type: STRUCT(messaging.v2.channels_sender.webhook)
      REQUIRED: false
    - name: profile
      type: STRUCT(messaging.v2.channels_sender.profile)
      REQUIRED: false
  messaging.v2.domain_cert_v4:
    - name: domain_sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Domain resource.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: Date that this Domain was last updated.
    - name: date_expires
      type: TIMESTAMP
      REQUIRED: false
      comment: Date that the private certificate associated with this domain expires. You will need to update the certificate before that date to ensure your shortened links will continue to work.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: Date that this Domain was registered to the Twilio platform to create a new Domain object.
    - name: domain_name
      type: STRING
      REQUIRED: false
      comment: Full url path for this domain.
    - name: certificate_sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify this Certificate resource.
    - name: managed
      type: BOOL
      REQUIRED: false
      comment: Boolean field that indicates whether the certificate is managed by Twilio or uploaded by the customer.
    - name: requesting
      type: BOOL
      REQUIRED: false
      comment: Boolean field that indicates whether a Twilio managed cert request is in progress or completed. True indicates a request is in progress and false indicates the request has completed or not requested yet.
    - name: url
      type: STRING
      REQUIRED: false
    - name: cert_in_validation
      type: ANY
      REQUIRED: false
      comment: Optional JSON field describing the status and upload date of a new certificate in the process of validation
  api.indicator.typing.createResponse200:
    - name: success
      type: BOOL
      REQUIRED: false
      comment: Indicates if the typing indicator was sent successfully.
  api.channel.senders.listResponse200:
    - name: senders
      type: "[]STRUCT(messaging.v2.channels_sender_response)"
      REQUIRED: false
    - name: meta
      type: OBJECT
      REQUIRED: false
