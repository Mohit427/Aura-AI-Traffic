  sync.v1.service.document:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Document resource.
    - name: unique_name
      type: STRING
      REQUIRED: false
      comment: An application-defined string that uniquely identifies the resource. It can be used in place of the resource's `sid` in the URL to address the resource and can be up to 320 characters long.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Document resource.
    - name: service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Sync Service](https://www.twilio.com/docs/sync/api/service) the resource is associated with.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Document resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URLs of resources related to the Sync Document.
    - name: revision
      type: STRING
      REQUIRED: false
      comment: The current revision of the Sync Document, represented as a string. The `revision` property is used with conditional updates to ensure data consistency.
    - name: data
      type: ANY
      REQUIRED: false
      comment: An arbitrary, schema-less object that the Sync Document stores. Can be up to 16 KiB in length.
    - name: date_expires
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the Sync Document expires and will be deleted, specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format. If the Sync Document does not expire, this value is `null`. The Document resource might not be deleted immediately after it expires.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: created_by
      type: STRING
      REQUIRED: false
      comment: The identity of the Sync Document's creator. If the Sync Document is created from the client SDK, the value matches the Access Token's `identity` field. If the Sync Document was created from the REST API, the value is `system`.
  sync.v1.service.document.document_permission:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Document Permission resource.
