STRUCTS:
  studio.v1.flow.engagement:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Engagement resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Engagement resource.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: contact_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Contact.
    - name: contact_channel_address
      type: STRING
      REQUIRED: false
      comment: The phone number, SIP address or Client identifier that triggered this Engagement. Phone numbers are in E.164 format (+16175551212). SIP addresses are formatted as `name@company.com`. Client identifiers are formatted `client:name`.
    - name: context
      type: ANY
      REQUIRED: false
      comment: The current state of the execution flow. As your flow executes, we save the state in a flow context. Your widgets can access the data in the flow context as variables, either in configuration fields or in text areas as variable substitution.
    - name: status
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the Engagement was created in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the Engagement was updated in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URLs of the Engagement's nested resources.
  studio.v1.flow.engagement.engagement_context:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Account.
    - name: context
      type: ANY
      REQUIRED: false
      comment: As your flow executes, we save the state in what's called the Flow Context. Any data in the flow context can be accessed by your widgets as variables, either in configuration fields or in text areas as variable substitution.
    - name: engagement_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Engagement.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of the resource.
  studio.v1.flow.execution:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Execution resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Execution resource.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: contact_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Contact.
    - name: contact_channel_address
      type: STRING
      REQUIRED: false
      comment: The phone number, SIP address or Client identifier that triggered the Execution. Phone numbers are in E.164 format (e.g. +16175551212). SIP addresses are formatted as `name@company.com`. Client identifiers are formatted `client:name`.
    - name: context
      type: ANY
      REQUIRED: false
      comment: The current state of the Flow's Execution. As a flow executes, we save its state in this context. We save data that your widgets can access as variables in configuration fields or in text areas as variable substitution.
    - name: status
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URLs of nested resources.
  studio.v1.flow.execution.execution_context:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the ExecutionContext resource.
    - name: context
      type: ANY
      REQUIRED: false
      comment: The current state of the Flow's Execution. As a flow executes, we save its state in this context. We save data that your widgets can access as variables in configuration fields or in text areas as variable substitution.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: execution_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the context's Execution resource.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  studio.v1.flow.execution.execution_step:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the ExecutionStep resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the ExecutionStep resource.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: execution_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Step's Execution resource.
    - name: parent_step_sid
      type: STRING
      REQUIRED: false
      comment: This field shows the Step SID of the Widget in the parent Flow that started the Subflow. If this Step is not part of a Subflow execution, the value is null.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The event that caused the Flow to transition to the Step.
    - name: context
      type: ANY
      REQUIRED: false
      comment: The current state of the Flow's Execution. As a flow executes, we save its state in this context. We save data that your widgets can access as variables in configuration fields or in text areas as variable substitution.
    - name: transitioned_from
      type: STRING
      REQUIRED: false
      comment: The Widget that preceded the Widget for the Step.
    - name: transitioned_to
      type: STRING
      REQUIRED: false
      comment: The Widget that will follow the Widget for the Step.
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of the widget that was executed.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URLs of related resources.
  studio.v1.flow.execution.execution_step.execution_step_context:
    - name: account_sid
