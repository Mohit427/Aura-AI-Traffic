STRUCTS:
  video.v1.composition:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Composition resource.
    - name: status
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_completed
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the composition's media processing task finished, specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_deleted
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the composition generated media was deleted, specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Composition resource.
    - name: room_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Group Room that generated the audio and video tracks used in the composition. All media sources included in a composition must belong to the same Group Room.
    - name: audio_sources
      type: "[]STRING"
      REQUIRED: false
      comment: The array of track names to include in the composition. The composition includes all audio sources specified in `audio_sources` except those specified in `audio_sources_excluded`. The track names in this property can include an asterisk as a wild card character, which matches zero or more characters in a track name. For example, `student*` includes tracks named `student` as well as `studentTeam`.
    - name: audio_sources_excluded
      type: "[]STRING"
      REQUIRED: false
      comment: The array of track names to exclude from the composition. The composition includes all audio sources specified in `audio_sources` except for those specified in `audio_sources_excluded`. The track names in this property can include an asterisk as a wild card character, which matches zero or more characters in a track name. For example, `student*` excludes `student` as well as `studentTeam`. This parameter can also be empty.
    - name: video_layout
      type: ANY
      REQUIRED: false
      comment: An object that describes the video layout of the composition in terms of regions. See [Specifying Video Layouts](https://www.twilio.com/docs/video/api/compositions-resource#specifying-video-layouts) for more info.
    - name: resolution
      type: STRING
      REQUIRED: false
      comment: The dimensions of the video image in pixels expressed as columns (width) and rows (height). The string's format is `{width}x{height}`, such as `640x480`.
    - name: trim
      type: BOOL
      REQUIRED: false
      comment: Whether to remove intervals with no media, as specified in the POST request that created the composition. Compositions with `trim` enabled are shorter when the Room is created and no Participant joins for a while as well as if all the Participants leave the room and join later, because those gaps will be removed. See [Specifying Video Layouts](https://www.twilio.com/docs/video/api/compositions-resource#specifying-video-layouts) for more info.
    - name: format
      type: STRING
      REQUIRED: false
    - name: bitrate
      type: INT
      REQUIRED: false
      comment: The average bit rate of the composition's media.
    - name: size
      type: INT
      REQUIRED: false
      comment: The size of the composed media file in bytes.
    - name: duration
      type: INT
      REQUIRED: false
      comment: The duration of the composition's media file in seconds.
    - name: media_external_location
      type: STRING
      REQUIRED: false
      comment: The URL of the media file associated with the composition when stored externally. See [External S3 Compositions](/docs/video/api/external-s3-compositions) for more details.
    - name: status_callback
      type: STRING
      REQUIRED: false
      comment: The URL called using the `status_callback_method` to send status information on every composition event.
    - name: status_callback_method
      type: STRING
      REQUIRED: false
      comment: "The HTTP method used to call `status_callback`. Can be: `POST` or `GET`, defaults to `POST`."
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URL of the media file associated with the composition.
  video.v1.composition_hook:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the CompositionHook resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource. Can be up to 100 characters long and must be unique within the account.
    - name: enabled
      type: BOOL
      REQUIRED: false
      comment: Whether the CompositionHook is active. When `true`, the CompositionHook is triggered for every completed Group Room on the account. When `false`, the CompositionHook is never triggered.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the CompositionHook resource.
    - name: audio_sources
      type: "[]STRING"
      REQUIRED: false
      comment: The array of track names to include in the compositions created by the composition hook. A composition triggered by the composition hook includes all audio sources specified in `audio_sources` except those specified in `audio_sources_excluded`. The track names in this property can include an asterisk as a wild card character, which matches zero or more characters in a track name. For example, `student*` includes tracks named `student` as well as `studentTeam`. Please, be aware that either video_layout or audio_sources have to be provided to get a valid creation request
    - name: audio_sources_excluded
      type: "[]STRING"
      REQUIRED: false
      comment: The array of track names to exclude from the compositions created by the composition hook. A composition triggered by the composition hook includes all audio sources specified in `audio_sources` except for those specified in `audio_sources_excluded`. The track names in this property can include an asterisk as a wild card character, which matches zero or more characters in a track name. For example, `student*` excludes `student` as well as `studentTeam`. This parameter can also be empty.
    - name: video_layout
      type: ANY
      REQUIRED: false
      comment: A JSON object that describes the video layout of the composition in terms of regions as specified in the HTTP POST request that created the CompositionHook resource. See [POST Parameters](https://www.twilio.com/docs/video/api/compositions-resource#http-post-parameters) for more information. Please, be aware that either video_layout or audio_sources have to be provided to get a valid creation request
    - name: resolution
      type: STRING
      REQUIRED: false
      comment: The dimensions of the video image in pixels expressed as columns (width) and rows (height). The string's format is `{width}x{height}`, such as `640x480`.
    - name: trim
      type: BOOL
      REQUIRED: false
      comment: Whether intervals with no media are clipped, as specified in the POST request that created the CompositionHook resource. Compositions with `trim` enabled are shorter when the Room is created and no Participant joins for a while as well as if all the Participants leave the room and join later, because those gaps will be removed. See [Specifying Video Layouts](https://www.twilio.com/docs/video/api/compositions-resource#specifying-video-layouts) for more info.
    - name: format
      type: STRING
      REQUIRED: false
    - name: status_callback
      type: STRING
      REQUIRED: false
      comment: The URL we call using the `status_callback_method` to send status information to your application.
    - name: status_callback_method
      type: STRING
      REQUIRED: false
      comment: The HTTP method we should use to call `status_callback`. Can be `POST` or `GET` and defaults to `POST`.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  video.v1.composition_settings:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the CompositionSettings resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource and that will be shown in the console
    - name: aws_credentials_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the stored Credential resource.
    - name: aws_s3_url
      type: STRING
      REQUIRED: false
      comment: The URL of the AWS S3 bucket where the compositions are stored. We only support DNS-compliant URLs like `https://documentation-example-twilio-bucket/compositions`, where `compositions` is the path in which you want the compositions to be stored. This URL accepts only URI-valid characters, as described in the [RFC 3986](https://tools.ietf.org/html/rfc3986#section-2).
    - name: aws_storage_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether all compositions are written to the `aws_s3_url`. When `false`, all compositions are stored in our cloud.
    - name: encryption_key_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Public Key resource used for encryption.
    - name: encryption_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether all compositions are stored in an encrypted form. The default is `false`.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  video.v1.recording:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Recording resource.
    - name: status
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Recording resource.
    - name: source_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the recording source. For a Room Recording, this value is a `track_sid`.
    - name: size
      type: INT
      REQUIRED: false
      comment: The size of the recorded track, in bytes.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: type
      type: STRING
      REQUIRED: false
    - name: duration
      type: INT
      REQUIRED: false
      comment: The duration of the recording in seconds rounded to the nearest second. Sub-second tracks have a `Duration` property of 1 second
    - name: container_format
      type: STRING
      REQUIRED: false
    - name: codec
      type: STRING
      REQUIRED: false
    - name: grouping_sids
      type: ANY
      REQUIRED: false
      comment: A list of SIDs related to the recording. Includes the `room_sid` and `participant_sid`.
    - name: track_name
      type: STRING
      REQUIRED: false
      comment: The name that was given to the source track of the recording. If no name is given, the `source_sid` is used.
    - name: offset
      type: INT
      REQUIRED: false
      comment: The time in milliseconds elapsed between an arbitrary point in time, common to all group rooms, and the moment when the source room of this track started. This information provides a synchronization mechanism for recordings belonging to the same room.
    - name: media_external_location
      type: STRING
      REQUIRED: false
      comment: The URL of the media file associated with the recording when stored externally. See [External S3 Recordings](/docs/video/api/external-s3-recordings) for more details.
    - name: status_callback
      type: STRING
      REQUIRED: false
      comment: The URL called using the `status_callback_method` to send status information on every recording event.
    - name: status_callback_method
