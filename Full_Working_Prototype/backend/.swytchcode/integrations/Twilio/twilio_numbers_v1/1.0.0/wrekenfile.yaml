  numbers.v1.porting_port_in_create:
    - name: account_sid
      type: STRING
      REQUIRED: true
      comment: Account Sid or subaccount where the phone number(s) will be Ported
    - name: documents
      type: "[]STRING"
      REQUIRED: true
      comment: List of document SIDs for all phone numbers included in the port in request. At least one document SID referring to a document of the type Utility Bill is required.
    - name: phone_numbers
      type: "[]ANY"
      REQUIRED: false
      comment: List of phone numbers to be ported. Maximum of 1,000 phone numbers per request.
    - name: losing_carrier_information
      type: STRUCT(numbers.v1.porting_losing_carrier_information)
      REQUIRED: true
      comment: Details regarding the customer's information with the losing carrier. These values will be used to generate the letter of authorization and should match the losing carrier's data as closely as possible to ensure the port is accepted.
    - name: notification_emails
      type: "[]STRING"
      REQUIRED: false
      comment: Additional emails to send a copy of the signed LOA to.
    - name: target_port_in_date
      type: DATE
      REQUIRED: false
      comment: "Target date to port the number. We cannot guarantee that this date will be honored by the other carriers, please work with Ops to get a confirmation of the firm order commitment (FOC) date. Expected format is ISO Local Date, example: ‘2011-12-03`. This date must be at least 7 days in the future for US ports and 10 days in the future for Japanese ports. We can't guarantee the exact date and time, as this depends on the losing carrier"
    - name: target_port_in_time_range_start
      type: STRING
      REQUIRED: false
      comment: "The earliest time that the port should occur on the target port in date. Expected format is ISO Offset Time, example: ‘10:15:00-08:00'. We can't guarantee the exact date and time, as this depends on the losing carrier"
    - name: target_port_in_time_range_end
      type: STRING
      REQUIRED: false
      comment: "The latest time that the port should occur on the target port in date. Expected format is ISO Offset Time, example: ‘10:15:00-08:00'. We can't guarantee the exact date and time, as this depends on the losing carrier"
    - name: bundle_sid
      type: STRING
      REQUIRED: false
      comment: The bundle sid is an optional identifier to reference a group of regulatory documents for a port request.
    - name: portability_advance_carrier
      type: STRING
      REQUIRED: false
      comment: A field only required for Japan port in requests. It is a unique identifier for the donor carrier service the line is being ported from.
    - name: auto_cancel_approval_numbers
      type: STRING
      REQUIRED: false
      comment: Japan specific field, indicates the number of phone numbers to automatically approve for cancellation.
