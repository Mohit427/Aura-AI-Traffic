      type: BOOL
      REQUIRED: false
      comment: Boolean to tell if extract Language Understanding Processing model matches results.
    - name: match_probability
      type: FLOAT
      REQUIRED: false
      comment: Percentage of 'matching' class needed to consider a sentence matches
    - name: normalized_result
      type: STRING
      REQUIRED: false
      comment: Normalized output of extraction stage which matches Label.
    - name: utterance_results
      type: "[]ANY"
      REQUIRED: false
      comment: List of mapped utterance object which matches sentences.
    - name: utterance_match
      type: BOOL
      REQUIRED: false
      comment: Boolean to tell if Utterance matches results.
    - name: predicted_label
      type: STRING
      REQUIRED: false
      comment: The 'matching' class. This might be available on conversation classify model outputs.
    - name: predicted_probability
      type: FLOAT
      REQUIRED: false
      comment: Percentage of 'matching' class needed to consider a sentence matches.
    - name: label_probabilities
      type: ANY
      REQUIRED: false
      comment: The labels probabilities. This might be available on conversation classify model outputs.
    - name: extract_results
