STRUCTS:
  voice.v1.byoc_trunk:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the BYOC Trunk resource.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that that we created to identify the BYOC Trunk resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: voice_url
      type: STRING
      REQUIRED: false
      comment: The URL we call using the `voice_method` when the BYOC Trunk receives a call.
    - name: voice_method
      type: STRING
      REQUIRED: false
      comment: "The HTTP method we use to call `voice_url`. Can be: `GET` or `POST`."
    - name: voice_fallback_url
      type: STRING
      REQUIRED: false
      comment: The URL that we call when an error occurs while retrieving or executing the TwiML requested from `voice_url`.
    - name: voice_fallback_method
      type: STRING
      REQUIRED: false
      comment: "The HTTP method we use to call `voice_fallback_url`. Can be: `GET` or `POST`."
    - name: status_callback_url
      type: STRING
      REQUIRED: false
      comment: The URL that we call to pass status parameters (such as call ended) to your application.
    - name: status_callback_method
      type: STRING
      REQUIRED: false
      comment: The HTTP method we use to call `status_callback_url`. Either `GET` or `POST`.
    - name: cnam_lookup_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether Caller ID Name (CNAM) lookup is enabled for the trunk. If enabled, all inbound calls to the BYOC Trunk from the United States and Canada automatically perform a CNAM Lookup and display Caller ID data on your phone. See [CNAM Lookups](https://www.twilio.com/docs/sip-trunking#CNAM) for more information.
    - name: connection_policy_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Connection Policy that Twilio will use when routing traffic to your communications infrastructure.
    - name: from_domain_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the SIP Domain that should be used in the `From` header of originating calls sent to your SIP infrastructure. If your SIP infrastructure allows users to "call back" an incoming call, configure this with a [SIP Domain](https://www.twilio.com/docs/voice/api/sending-sip) to ensure proper routing. If not configured, the from domain will default to "sip.twilio.com".
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT that the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT that the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  voice.v1.connection_policy:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Connection Policy resource.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Connection Policy resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URLs of related resources.
  voice.v1.connection_policy.connection_policy_target:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Target resource.
    - name: connection_policy_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Connection Policy that owns the Target.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Target resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: target
      type: STRING
      REQUIRED: false
      comment: The SIP address you want Twilio to route your calls to. This must be a `sip:` schema. `sips` is NOT supported.
    - name: priority
      type: INT
      REQUIRED: false
      comment: The relative importance of the target. Can be an integer from 0 to 65535, inclusive, and the default is 10. The lowest number represents the most important target.
    - name: weight
      type: INT
      REQUIRED: false
      comment: The value that determines the relative share of the load the Target should receive compared to other Targets with the same priority. Can be an integer from 1 to 65535, inclusive, and the default is 10. Targets with higher values receive more load than those with lower ones with the same priority.
    - name: enabled
      type: BOOL
      REQUIRED: false
      comment: Whether the target is enabled. The default is `true`.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  voice.v1.dialing_permissions.dialing_permissions_country:
    - name: iso_code
      type: STRING
      REQUIRED: false
      comment: The [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the country.
    - name: continent
      type: STRING
      REQUIRED: false
      comment: The name of the continent in which the country is located.
    - name: country_codes
      type: "[]STRING"
      REQUIRED: false
      comment: The E.164 assigned [country codes(s)](https://www.itu.int/itudoc/itu-t/ob-lists/icc/e164_763.html)
    - name: low_risk_numbers_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether dialing to low-risk numbers is enabled.
    - name: high_risk_special_numbers_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether dialing to high-risk special services numbers is enabled. These prefixes include number ranges allocated by the country and include premium numbers, special services, shared cost, and others
    - name: high_risk_tollfraud_numbers_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether dialing to high-risk [toll fraud](https://www.twilio.com/blog/how-to-protect-your-account-from-toll-fraud-with-voice-dialing-geo-permissions-html) numbers is enabled. These prefixes include narrow number ranges that have a high-risk of international revenue sharing fraud (IRSF) attacks, also known as [toll fraud](https://www.twilio.com/blog/how-to-protect-your-account-from-toll-fraud-with-voice-dialing-geo-permissions-html). These prefixes are collected from anti-fraud databases and verified by analyzing calls on our network. These prefixes are not available for download and are updated frequently
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of this resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: A list of URLs related to this resource.
  voice.v1.dialing_permissions.dialing_permissions_country-instance:
    - name: iso_code
      type: STRING
      REQUIRED: false
      comment: The [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the country.
    - name: continent
      type: STRING
      REQUIRED: false
      comment: The name of the continent in which the country is located.
    - name: country_codes
      type: "[]STRING"
      REQUIRED: false
      comment: The E.164 assigned [country codes(s)](https://www.itu.int/itudoc/itu-t/ob-lists/icc/e164_763.html)
    - name: low_risk_numbers_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether dialing to low-risk numbers is enabled.
    - name: high_risk_special_numbers_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether dialing to high-risk special services numbers is enabled. These prefixes include number ranges allocated by the country and include premium numbers, special services, shared cost, and others
    - name: high_risk_tollfraud_numbers_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether dialing to high-risk [toll fraud](https://www.twilio.com/blog/how-to-protect-your-account-from-toll-fraud-with-voice-dialing-geo-permissions-html) numbers is enabled. These prefixes include narrow number ranges that have a high-risk of international revenue sharing fraud (IRSF) attacks, also known as [toll fraud](https://www.twilio.com/blog/how-to-protect-your-account-from-toll-fraud-with-voice-dialing-geo-permissions-html). These prefixes are collected from anti-fraud databases and verified by analyzing calls on our network. These prefixes are not available for download and are updated frequently
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of this resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: A list of URLs related to this resource.
  voice.v1.dialing_permissions.dialing_permissions_country_bulk_update:
    - name: update_count
      type: INT
      REQUIRED: false
      comment: The number of countries updated
    - name: update_request
      type: STRING
      REQUIRED: false
      comment: "A bulk update request to change voice dialing country permissions stored as a URL-encoded, JSON array of update objects. For example : `[ { \"iso_code\": \"GB\", \"low_risk_numbers_enabled\": \"true\", \"high_risk_special_numbers_enabled\":\"true\", \"high_risk_tollfraud_numbers_enabled\": \"false\" } ]`"
  voice.v1.dialing_permissions.dialing_permissions_country.dialing_permissions_hrs_prefixes:
    - name: prefix
      type: STRING
      REQUIRED: false
      comment: A prefix is a contiguous number range for a block of E.164 numbers that includes the E.164 assigned country code. For example, a North American Numbering Plan prefix like `+1510720` written like `+1(510) 720` matches all numbers inclusive from `+1(510) 720-0000` to `+1(510) 720-9999`.
  voice.v1.dialing_permissions.dialing_permissions_settings:
    - name: dialing_permissions_inheritance
      type: BOOL
      REQUIRED: false
      comment: "`true` if the sub-account will inherit voice dialing permissions from the Master Project; otherwise `false`."
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of this resource.
  voice.v1.ip_record:
