STRUCTS:
  api.v2010.account:
    - name: auth_token
      type: STRING
      REQUIRED: false
      comment: The authorization token for this account. This token should be kept a secret, so no sharing.
    - name: date_created
      type: STRING
      REQUIRED: false
      comment: The date that this account was created, in GMT in RFC 2822 format
    - name: date_updated
      type: STRING
      REQUIRED: false
      comment: The date that this account was last updated, in GMT in RFC 2822 format.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human readable description of this account, up to 64 characters long. By default the FriendlyName is your email address.
    - name: owner_account_sid
      type: STRING
      REQUIRED: false
      comment: The unique 34 character id that represents the parent of this account. The OwnerAccountSid of a parent account is it's own sid.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this resource.
    - name: status
      type: STRING
      REQUIRED: false
    - name: subresource_uris
      type: OBJECT
      REQUIRED: false
      comment: A Map of various subresources available for the given Account Instance
    - name: type
      type: STRING
      REQUIRED: false
    - name: uri
      type: STRING
      REQUIRED: false
      comment: The URI for this resource, relative to `https://api.twilio.com`
  api.v2010.account.address:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that is responsible for the Address resource.
    - name: city
      type: STRING
      REQUIRED: false
      comment: The city in which the address is located.
    - name: customer_name
      type: STRING
      REQUIRED: false
      comment: The name associated with the address.This property has a maximum length of 16 4-byte characters, or 21 3-byte characters.
    - name: date_created
      type: STRING
      REQUIRED: false
      comment: The date and time in GMT that the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: STRING
      REQUIRED: false
      comment: The date and time in GMT that the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: iso_country
      type: STRING
      REQUIRED: false
      comment: The ISO country code of the address.
    - name: postal_code
      type: STRING
      REQUIRED: false
      comment: The postal code of the address.
    - name: region
      type: STRING
      REQUIRED: false
      comment: The state or region of the address.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that that we created to identify the Address resource.
    - name: street
      type: STRING
      REQUIRED: false
      comment: The number and street address of the address.
    - name: uri
      type: STRING
      REQUIRED: false
      comment: The URI of the resource, relative to `https://api.twilio.com`.
    - name: emergency_enabled
      type: BOOL
      REQUIRED: false
      comment: Whether emergency calling has been enabled on this number.
    - name: validated
      type: BOOL
      REQUIRED: false
      comment: Whether the address has been validated to comply with local regulation. In countries that require valid addresses, an invalid address will not be accepted. `true` indicates the Address has been validated. `false` indicate the country doesn't require validation or the Address is not valid.
    - name: verified
      type: BOOL
      REQUIRED: false
      comment: Whether the address has been verified to comply with regulation. In countries that require valid addresses, an invalid address will not be accepted. `true` indicates the Address has been verified. `false` indicate the country doesn't require verified or the Address is not valid.
    - name: street_secondary
      type: STRING
      REQUIRED: false
      comment: The additional number and street address of the address.
  api.v2010.account.application:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Application resource.
    - name: api_version
      type: STRING
      REQUIRED: false
      comment: The API version used to start a new TwiML session.
    - name: date_created
      type: STRING
      REQUIRED: false
      comment: The date and time in GMT that the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: STRING
      REQUIRED: false
      comment: The date and time in GMT that the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: message_status_callback
      type: STRING
      REQUIRED: false
      comment: The URL we call using a POST method to send message status information to your application.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that that we created to identify the Application resource.
    - name: sms_fallback_method
      type: STRING
      REQUIRED: false
      comment: "The HTTP method we use to call `sms_fallback_url`. Can be: `GET` or `POST`."
    - name: sms_fallback_url
      type: STRING
      REQUIRED: false
      comment: The URL that we call when an error occurs while retrieving or executing the TwiML from `sms_url`.
    - name: sms_method
      type: STRING
      REQUIRED: false
      comment: "The HTTP method we use to call `sms_url`. Can be: `GET` or `POST`."
    - name: sms_status_callback
      type: STRING
      REQUIRED: false
      comment: The URL we call using a POST method to send status information to your application about SMS messages that refer to the application.
    - name: sms_url
      type: STRING
      REQUIRED: false
      comment: The URL we call when the phone number receives an incoming SMS message.
    - name: status_callback
      type: STRING
      REQUIRED: false
      comment: The URL we call using the `status_callback_method` to send status information to your application.
    - name: status_callback_method
      type: STRING
      REQUIRED: false
      comment: "The HTTP method we use to call `status_callback`. Can be: `GET` or `POST`."
    - name: uri
      type: STRING
      REQUIRED: false
      comment: The URI of the resource, relative to `https://api.twilio.com`.
    - name: voice_caller_id_lookup
      type: BOOL
      REQUIRED: false
      comment: "Whether we look up the caller's caller-ID name from the CNAM database (additional charges apply). Can be: `true` or `false`."
    - name: voice_fallback_method
      type: STRING
      REQUIRED: false
      comment: "The HTTP method we use to call `voice_fallback_url`. Can be: `GET` or `POST`."
    - name: voice_fallback_url
      type: STRING
      REQUIRED: false
      comment: The URL that we call when an error occurs retrieving or executing the TwiML requested by `url`.
    - name: voice_method
      type: STRING
      REQUIRED: false
      comment: "The HTTP method we use to call `voice_url`. Can be: `GET` or `POST`."
    - name: voice_url
      type: STRING
      REQUIRED: false
      comment: The URL we call when the phone number assigned to this application receives a call.
    - name: public_application_connect_enabled
      type: BOOL
      REQUIRED: false
      comment: "Whether to allow other Twilio accounts to dial this applicaton using Dial verb. Can be: `true` or `false`."
  api.v2010.account.authorized_connect_app:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the AuthorizedConnectApp resource.
    - name: connect_app_company_name
      type: STRING
      REQUIRED: false
      comment: The company name set for the Connect App.
    - name: connect_app_description
      type: STRING
      REQUIRED: false
      comment: A detailed description of the Connect App.
    - name: connect_app_friendly_name
      type: STRING
      REQUIRED: false
      comment: The name of the Connect App.
    - name: connect_app_homepage_url
      type: STRING
      REQUIRED: false
      comment: The public URL for the Connect App.
    - name: connect_app_sid
      type: STRING
      REQUIRED: false
      comment: The SID that we assigned to the Connect App.
    - name: permissions
      type: "[]STRING"
      REQUIRED: false
      comment: "The set of permissions that you authorized for the Connect App.  Can be: `get-all` or `post-all`."
    - name: uri
