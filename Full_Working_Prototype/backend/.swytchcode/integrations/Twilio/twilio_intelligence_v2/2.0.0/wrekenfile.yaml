    - name: availability
      type: STRING
      REQUIRED: false
    - name: config
      type: ANY
      REQUIRED: false
      comment: Operator configuration, following the schema defined by the Operator Type. Only available on Custom Operators created by the Account.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Operator was created, given in ISO 8601 format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Operator was updated, given in ISO 8601 format.
