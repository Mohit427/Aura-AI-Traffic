VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://marketplace.twilio.com
METHODS:
  twilio_marketplace.availableaddon.list:
    SUMMARY: Retrieve a list of Add-ons currently available to be installed.
    DESC: Retrieve a list of Add-ons currently available to be installed.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/AvailableAddOns
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - PageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - Page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - PageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.availableaddon.listResponse200)
        RETURNVAR: twilio_marketplace_availableaddon_list
        STATUS: 200
    CANONICAL_ID: twilio_marketplace.availableaddon.list
  twilio_marketplace.availableaddon.get:
    SUMMARY: Fetch an instance of an Add-on currently available to be installed.
    DESC: Fetch an instance of an Add-on currently available to be installed.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/AvailableAddOns/{Sid}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(marketplace.v1.available_add_on)
        RETURNVAR: twilio_marketplace_availableaddon_get
        STATUS: 200
    CANONICAL_ID: twilio_marketplace.availableaddon.get
  twilio_marketplace.availableaddon.extensions.get:
    SUMMARY: Retrieve a list of Extensions for the Available Add-on.
    DESC: Retrieve a list of Extensions for the Available Add-on.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/AvailableAddOns/{AvailableAddOnSid}/Extensions
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - AvailableAddOnSid:
          TYPE: STRING
          LOCATION: path
      - PageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - Page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - PageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.availableaddon.extensions.getResponse200)
        RETURNVAR: twilio_marketplace_availableaddon_extensions_get
