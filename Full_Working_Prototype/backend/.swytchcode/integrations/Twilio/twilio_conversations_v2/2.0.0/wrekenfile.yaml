      type: STRING
      REQUIRED: true
      comment: Participant ID.
    - name: conversationId
      type: STRING
      REQUIRED: true
      comment: Conversation ID.
    - name: accountId
      type: STRING
      REQUIRED: true
      comment: Account ID.
    - name: name
      type: STRING
      REQUIRED: true
      comment: Participant display name.
    - name: type
      type: STRING
      REQUIRED: false
      comment: Type of Participant in the Conversation.
    - name: profileId
      type: STRING
      REQUIRED: false
      comment: "Profile ID. Note: This field is only resolved for `CUSTOMER` participant types, not for `HUMAN_AGENT` or `AI_AGENT` participants."
    - name: addresses
      type: "[]STRUCT(conversations.v2.address)"
      REQUIRED: false
      comment: |
        Communication addresses for this Participant. Address format varies by channel:
        - SMS/VOICE: E.164 phone number (such as "+18005550100")
        - EMAIL: Email address (such as "user@example.com")
        - WHATSAPP: Phone number with whatsapp prefix (such as "whatsapp:+18005550100")
        - RCS: Sender ID or phone number with rcs prefix (such as "rcs:brand_acme_agent" or "rcs:+18005550100")
    - name: createdAt
      type: TIMESTAMP
      REQUIRED: false
      comment: Timestamp when this Participant was created.
    - name: updatedAt
      type: TIMESTAMP
      REQUIRED: false
      comment: Timestamp when this Participant was last updated.
  conversations.v2.address:
    - name: channel
      type: STRING
      REQUIRED: true
      comment: The channel for Communication.
    - name: address
      type: STRING
      REQUIRED: true
      comment: |
        The address value formatted according to channel type:
        - SMS/VOICE: E.164 phone number (such as "+18005550100")
        - WHATSAPP: Phone number with whatsapp prefix (such as "whatsapp:+18005550100")
        - RCS: Sender ID or phone number with rcs prefix (such as "rcs:brand_acme_agent" or "rcs:+18005550100")
        - CHAT: Customer-defined string identifier
    - name: channelId
      type: STRING
      REQUIRED: false
      comment: Channel-specific ID for correlating Communications.
  conversations.v2.participant_address:
    - name: address
      type: STRING
      REQUIRED: true
      comment: |
        The address value formatted according to channel type:
        - SMS/VOICE: E.164 phone number (such as "+18005550100")
        - WHATSAPP: Phone number with whatsapp prefix (such as "whatsapp:+18005550100")
        - RCS: Sender ID or phone number with rcs prefix (such as "rcs:brand_acme_agent" or "rcs:+18005550100")
        - CHAT: Customer-defined string identifier
    - name: channel
      type: STRING
      REQUIRED: true
      comment: Channel type for the Participant address.
    - name: participantId
      type: STRING
      REQUIRED: false
      comment: Participant ID associated with this address.
  conversations.v2.channel_setting:
    - name: statusTimeouts
      type: STRUCT(conversations.v2.status_timeouts)
      REQUIRED: false
    - name: captureRules
      type: "[]STRUCT(conversations.v2.capture_rule)"
      REQUIRED: false
      comment: Array of capture rules with from/to addresses and optional metadata. Use `*` for wildcard matching in either direction.
  conversations.v2.status_timeouts:
    - name: inactive
      type: INT
      REQUIRED: false
      comment: Inactivity timeout in minutes.
    - name: closed
      type: INT
      REQUIRED: false
      comment: Close timeout in minutes.
  conversations.v2.capture_rule:
    - name: from
      type: STRING
      REQUIRED: true
      comment: The from address. Use `*` for wildcard to match any from address.
    - name: to
      type: STRING
      REQUIRED: true
      comment: The to address. Use `*` for wildcard to match any to address.
    - name: metadata
      type: map[STRING]STRING
      REQUIRED: false
      comment: Additional matching criteria for the capture rule. For voice calls, can include `callType` (`PSTN`, `SIP`, and similar).
