      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Transcript was created, given in ISO 8601 format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Transcript was updated, given in ISO 8601 format.
    - name: status
      type: STRING
      REQUIRED: false
    - name: channel
      type: ANY
      REQUIRED: false
      comment: Media Channel describing Transcript Source and Participant Mapping
    - name: data_logging
      type: BOOL
      REQUIRED: false
      comment: |-
        Data logging allows Twilio to improve the quality of the speech recognition & language understanding services through using customer data to refine, fine tune and evaluate machine learning models.
        Note: Data logging cannot be activated via API, only via www.twilio.com, as it requires additional consent.
    - name: language_code
      type: STRING
      REQUIRED: false
      comment: The default language code of the audio.
    - name: customer_key
      type: STRING
      REQUIRED: false
    - name: media_start_time
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Transcript's media was started, given in ISO 8601 format.
    - name: duration
      type: INT
      REQUIRED: false
      comment: The duration of this Transcript's source
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
    - name: redaction
      type: BOOL
      REQUIRED: false
      comment: If the transcript has been redacted, a redacted alternative of the transcript will be available.
    - name: encryption_credential_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Public Key resource used to encrypt the sentences and operator results.
    - name: links
      type: OBJECT
      REQUIRED: false
