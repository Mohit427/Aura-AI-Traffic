STRUCTS:
  trunking.v1.trunk.credential_list:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the CredentialList resource.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the CredentialList resource.
    - name: trunk_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Trunk the credential list in associated with.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  trunking.v1.trunk.ip_access_control_list:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the IpAccessControlList resource.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the IpAccessControlList resource.
    - name: trunk_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Trunk the resource is associated with.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the resource.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [RFC 2822](https://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  trunking.v1.trunk.origination_url:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the OriginationUrl resource.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the OriginationUrl resource.
    - name: trunk_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Trunk that owns the Origination URL.
    - name: weight
      type: INT
      REQUIRED: false
      comment: The value that determines the relative share of the load the URI should receive compared to other URIs with the same priority. Can be an integer from 1 to 65535, inclusive, and the default is 10. URLs with higher values receive more load than those with lower ones with the same priority.
    - name: enabled
      type: BOOL
      REQUIRED: false
      comment: Whether the URL is enabled. The default is `true`.
