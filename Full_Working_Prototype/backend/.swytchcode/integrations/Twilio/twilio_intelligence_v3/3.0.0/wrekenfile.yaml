    - name: version
      type: INT
      REQUIRED: false
      comment: |
        The specific version of the Language Operator to execute. When provided, the Rule will use this exact version of the Operator.
        When omitted, the latest active version of the Operator is used at execution time.
    - name: parameters
      type: OBJECT
      REQUIRED: false
      comment: |
        Key-value mapping for parameters defined as part of the Operator schema. The key and value passed by the Rule must match the name and data type of the parameter defined in the Operator, respectively.
        These parameters will customize the behavior of the Operator when executed by the Rule via runtime substitution into the prompt.
