STRUCTS:
  GenerateContentRequest:
    - name: contents
      TYPE: "[]STRUCT(Content)"
      REQUIRED: true
    - name: tools
      TYPE: "[]map[STRING]ANY"
      REQUIRED: false
    - name: toolConfig
      TYPE: map[STRING]ANY
      REQUIRED: false
    - name: safetySettings
      TYPE: "[]map[STRING]ANY"
      REQUIRED: false
    - name: systemInstruction
      TYPE: map[STRING]ANY
      REQUIRED: false
    - name: generationConfig
      TYPE: map[STRING]ANY
      REQUIRED: false
    - name: cachedContent
      TYPE: STRING
      REQUIRED: false
  Content:
    - name: parts
      TYPE: "[]map[STRING]ANY"
      REQUIRED: false
    - name: role
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - user
        - model
