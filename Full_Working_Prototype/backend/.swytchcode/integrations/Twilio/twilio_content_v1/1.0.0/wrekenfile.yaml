VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://content.twilio.com
METHODS:
  twilio_content.content.whatsapp.create:
    SUMMARY: Create Content Approval Request
    DESC: Create a ContentApprovalRequest for a content item
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/Content/{ContentSid}/ApprovalRequests/whatsapp
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ContentApprovalRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - ContentSid:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(ContentApprovalRequest)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(content.v1.content.approval_create)
        RETURNVAR: twilio_content_content_whatsapp_create_201
        STATUS: 201
    CANONICAL_ID: twilio_content.content.whatsapp.create
  twilio_content.content.approvalRequests.get:
    SUMMARY: Fetch Approval Status
    DESC: Fetch a Content resource's approval status by its unique Content Sid
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Content/{Sid}/ApprovalRequests
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(content.v1.content.approval_fetch)
        RETURNVAR: twilio_content_content_approvalRequests_get
        STATUS: 200
    CANONICAL_ID: twilio_content.content.approvalRequests.get
  twilio_content.content.get:
    SUMMARY: Fetch Content
    DESC: Fetch a Content resource by its unique Content Sid
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Content/{Sid}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(content.v1.content)
        RETURNVAR: twilio_content_content_get
        STATUS: 200
    CANONICAL_ID: twilio_content.content.get
  twilio_content.content.delete:
    SUMMARY: Delete Content
    DESC: Deletes a Content resource
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/Content/{Sid}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
    CANONICAL_ID: twilio_content.content.delete
  twilio_content.content.update:
    SUMMARY: Update Content
    DESC: Update a Content resource
    HTTP:
      METHOD: PUT
      ENDPOINT: /v1/Content/{Sid}
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ContentUpdateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - Sid:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(ContentUpdateRequest)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(content.v1.content)
        RETURNVAR: twilio_content_content_update
        STATUS: 200
    CANONICAL_ID: twilio_content.content.update
  twilio_content.content.create:
    SUMMARY: Create Content
    DESC: Create a Content resource
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/Content
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ContentCreateRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(ContentCreateRequest)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(content.v1.content)
        RETURNVAR: twilio_content_content_create_201
        STATUS: 201
    CANONICAL_ID: twilio_content.content.create
  twilio_content.content.list:
    SUMMARY: List Contents
    DESC: Retrieve a list of Contents belonging to the account used to make the request
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Content
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - PageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - Page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - PageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.content.listResponse200)
        RETURNVAR: twilio_content_content_list
        STATUS: 200
    CANONICAL_ID: twilio_content.content.list
  twilio_content.contentandapproval.list:
    SUMMARY: List Content Approvals
    DESC: Retrieve a list of Contents with approval statuses belonging to the account used to make the request
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/ContentAndApprovals
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - PageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - Page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - PageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.contentandapproval.listResponse200)
        RETURNVAR: twilio_content_contentandapproval_list
        STATUS: 200
    CANONICAL_ID: twilio_content.contentandapproval.list
  twilio_content.legacycontent.list:
    SUMMARY: List Legacy Contents
    DESC: Retrieve a list of Legacy Contents belonging to the account used to make the request
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/LegacyContent
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - PageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - Page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
      - PageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.legacycontent.listResponse200)
        RETURNVAR: twilio_content_legacycontent_list
        STATUS: 200
    CANONICAL_ID: twilio_content.legacycontent.list
