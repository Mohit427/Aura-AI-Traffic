      REQUIRED: true
      comment: List of Operators to be executed by the Rule. Maximum of five (5) Operators allowed per Rule.
    - name: triggers
      type: "[]STRUCT(Trigger)"
      REQUIRED: true
      comment: List of Triggers that determine when to activate the Rule. Maximum of one (1) Trigger allowed per Rule.
    - name: actions
