    - name: mms_converter
      type: BOOL
      REQUIRED: false
      comment: Whether to enable the [MMS Converter](https://www.twilio.com/docs/messaging/services#mms-converter) for messages sent through the Service instance.
    - name: smart_encoding
      type: BOOL
      REQUIRED: false
      comment: Whether to enable [Smart Encoding](https://www.twilio.com/docs/messaging/services#smart-encoding) for messages sent through the Service instance.
    - name: scan_message_content
      type: STRING
      REQUIRED: false
    - name: fallback_to_long_code
      type: BOOL
      REQUIRED: false
      comment: "[OBSOLETE] Former feature used to fallback to long code sender after certain short code message failures."
    - name: area_code_geomatch
      type: BOOL
      REQUIRED: false
      comment: Whether to enable [Area Code Geomatch](https://www.twilio.com/docs/messaging/services#area-code-geomatch) on the Service Instance.
    - name: synchronous_validation
      type: BOOL
      REQUIRED: false
      comment: Reserved.
    - name: validity_period
      type: INT
      REQUIRED: false
      comment: How long, in seconds, messages sent from the Service are valid. Can be an integer from `1` to `36,000`. Default value is `36,000`.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Service resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The absolute URLs of related resources.
    - name: usecase
      type: STRING
      REQUIRED: false
      comment: A string that describes the scenario in which the Messaging Service will be used. Possible values are `notifications`, `marketing`, `verification`, `discussion`, `poll`, `undeclared`.
    - name: us_app_to_person_registered
      type: BOOL
      REQUIRED: false
      comment: Whether US A2P campaign is registered for this Service.
    - name: use_inbound_webhook_on_number
      type: BOOL
      REQUIRED: false
      comment: A boolean value that indicates either the webhook url configured on the phone number will be used or `inbound_request_url`/`fallback_url` url will be called when a message is received from the phone number. If this field is enabled then the webhook url defined on the phone number will override the `inbound_request_url`/`fallback_url` defined for the Messaging Service.
