    - name: mixer_region_requested
      type: STRING
      REQUIRED: false
      comment: Twilio region where conference mixed was specified to be mixed in configuration.
    - name: recording_enabled
      type: BOOL
      REQUIRED: false
      comment: Boolean. Indicates whether recording was enabled at the conference mixer.
    - name: detected_issues
      type: ANY
      REQUIRED: false
      comment: Potential issues detected by Twilio during the conference.
    - name: tags
      type: "[]STRING"
      REQUIRED: false
      comment: Tags for detected conference conditions and participant behaviors which may be of interest.
    - name: tag_info
      type: ANY
      REQUIRED: false
      comment: Object. Contains details about conference tags including severity.
    - name: processing_state
      type: STRING
