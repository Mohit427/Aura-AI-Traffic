VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://oauth.twilio.com
METHODS:
  twilio_oauth.authorize.list:
    SUMMARY: Retrieves authorize uri
    DESC: Retrieves authorize uri
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/authorize
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - ResponseType:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - ClientId:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - RedirectUri:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - Scope:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - State:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    CANONICAL_ID: twilio_oauth.authorize.list
  twilio_oauth.token.create:
    SUMMARY: Issues a new Access token (optionally identity_token & refresh_token) in exchange of Oauth grant
    DESC: Issues a new Access token (optionally identity_token & refresh_token) in exchange of Oauth grant
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/token
      HEADERS:
        Content-Type: application/x-www-form-urlencoded
      CONTENT_TYPE: application/x-www-form-urlencoded
      ACCEPT: application/json
      BODYTYPE: x-www-form-urlencoded
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - GrantType:
          TYPE: STRING
          LOCATION: body
      - ClientId:
          TYPE: STRING
          LOCATION: body
      - ClientSecret:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - Code:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - RedirectUri:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - Audience:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - RefreshToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
      - Scope:
          TYPE: STRING
          REQUIRED: false
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(oauth.v1.token)
        RETURNVAR: twilio_oauth_token_create_201
        STATUS: 201
    CANONICAL_ID: twilio_oauth.token.create
STRUCTS:
  oauth.v1.token:
    - name: access_token
      type: STRING
      REQUIRED: false
      comment: Token which carries the necessary information to access a Twilio resource directly.
    - name: refresh_token
      type: STRING
      REQUIRED: false
      comment: Token which carries the information necessary to get a new access token.
    - name: id_token
      type: STRING
      REQUIRED: false
      comment: Token which carries the information necessary of user profile.
    - name: token_type
      type: STRING
      REQUIRED: false
      comment: Token type
    - name: expires_in
      type: INT
      REQUIRED: false
