  numbers.v1.porting_portability:
    - name: phone_number
      type: STRING
      REQUIRED: false
      comment: The phone number which portability is to be checked. Phone numbers are in E.164 format (e.g. +16175551212).
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: Account Sid that the phone number belongs to in Twilio. This is only returned for phone numbers that already exist in Twilio’s inventory and belong to your account or sub account.
