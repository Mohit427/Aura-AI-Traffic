VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://lookups.twilio.com
METHODS:
  twilio_lookups.phonenumber.get:
    SUMMARY: Perform operation FetchPhoneNumber
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/PhoneNumbers/{PhoneNumber}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - PhoneNumber:
          TYPE: STRING
          LOCATION: path
      - CountryCode:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - Type:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - AddOns:
          TYPE: "[]STRING"
          REQUIRED: false
          LOCATION: query
      - AddOnsData:
          TYPE: OBJECT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(lookups.v1.phone_number)
        RETURNVAR: twilio_lookups_phonenumber_get
        STATUS: 200
    CANONICAL_ID: twilio_lookups.phonenumber.get
STRUCTS:
  lookups.v1.phone_number:
    - name: caller_name
      type: ANY
      REQUIRED: false
      comment: The name of the phone number's owner. If `null`, that information was not available.
    - name: country_code
      type: STRING
      REQUIRED: false
      comment: The [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) for the phone number.
    - name: phone_number
      type: STRING
      REQUIRED: false
      comment: The phone number in [E.164](https://www.twilio.com/docs/glossary/what-e164) format, which consists of a + followed by the country code and subscriber number.
    - name: national_format
      type: STRING
      REQUIRED: false
      comment: The phone number, in national format.
    - name: carrier
      type: ANY
      REQUIRED: false
      comment: The telecom company that provides the phone number.
    - name: add_ons
      type: ANY
      REQUIRED: false
      comment: A JSON string with the results of the Add-ons you specified in the `add_ons` parameters. For the format of the object, see [Using Add-ons](https://www.twilio.com/docs/add-ons).
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
