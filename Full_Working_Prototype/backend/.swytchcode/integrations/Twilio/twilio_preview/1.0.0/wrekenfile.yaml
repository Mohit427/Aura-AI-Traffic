  preview.hosted_numbers.authorization_document:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this AuthorizationDocument.
    - name: address_sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies the Address resource that is associated with this AuthorizationDocument.
    - name: status
      type: STRING
      REQUIRED: false
    - name: email
      type: STRING
      REQUIRED: false
      comment: Email that this AuthorizationDocument will be sent to for signing.
    - name: cc_emails
      type: "[]STRING"
      REQUIRED: false
      comment: Email recipients who will be informed when an Authorization Document has been sent and signed.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date this resource was created, given as [GMT RFC 2822](http://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was updated, given as [GMT RFC 2822](http://www.ietf.org/rfc/rfc2822.txt) format.
    - name: url
      type: STRING
      REQUIRED: false
    - name: links
      type: OBJECT
      REQUIRED: false
  preview.hosted_numbers.authorization_document.dependent_hosted_number_order:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Authorization Document
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: incoming_phone_number_sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies the IncomingPhoneNumber resource created by this HostedNumberOrder.
    - name: address_sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies the Address resource that represents the address of the owner of this phone number.
    - name: signing_document_sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies the LOA document associated with this HostedNumberOrder.
    - name: phone_number
      type: STRING
      REQUIRED: false
      comment: An E164 formatted phone number hosted by this HostedNumberOrder.
    - name: capabilities
      type: OBJECT
      REQUIRED: false
      comment: A mapping of capabilities this hosted phone number will have enabled on Twilio's platform.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human readable description of this resource, up to 64 characters.
    - name: unique_name
      type: STRING
      REQUIRED: false
      comment: Provides a unique and addressable name to be assigned to this HostedNumberOrder, assigned by the developer, to be optionally used in addition to SID.
    - name: status
      type: STRING
      REQUIRED: false
    - name: failure_reason
      type: STRING
      REQUIRED: false
      comment: A message that explains why a hosted_number_order went to status "action-required"
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date this resource was created, given as [GMT RFC 2822](http://www.ietf.org/rfc/rfc2822.txt) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was updated, given as [GMT RFC 2822](http://www.ietf.org/rfc/rfc2822.txt) format.
    - name: verification_attempts
      type: INT
      REQUIRED: false
      comment: The number of attempts made to verify ownership of the phone number that is being hosted.
    - name: email
      type: STRING
      REQUIRED: false
      comment: Email of the owner of this phone number that is being hosted.
    - name: cc_emails
      type: "[]STRING"
      REQUIRED: false
      comment: Email recipients who will be informed when an Authorization Document has been sent and signed
    - name: verification_type
      type: STRING
      REQUIRED: false
    - name: verification_document_sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies the Identity Document resource that represents the document for verifying ownership of the number to be hosted.
    - name: extension
      type: STRING
      REQUIRED: false
      comment: A numerical extension to be used when making the ownership verification call.
    - name: call_delay
      type: INT
      REQUIRED: false
      comment: A value between 0-30 specifying the number of seconds to delay initiating the ownership verification call.
    - name: verification_code
      type: STRING
      REQUIRED: false
      comment: The digits passed during the ownership verification call.
    - name: verification_call_sids
      type: "[]STRING"
      REQUIRED: false
      comment: A list of 34 character strings that are unique identifiers for the calls placed as part of ownership verification.
