VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://memory.twilio.com
METHODS:
  twilio_memory.store.profiles.delete:
    SUMMARY: Delete Profile
    DESC: Asynchronously delete the profile permanently and all associated identifiers and traits. This operation is irreversible. Downstream caches or analytical stores may take time to reflect the deletion. Use cautiously and consider a soft‑delete strategy if regulatory or recovery requirements apply.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(api.store.profiles.deleteResponse202)
        RETURNVAR: twilio_memory_store_profiles_delete_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.profiles.delete
  twilio_memory.store.profiles.get:
    SUMMARY: Get Profile
    DESC: Retrieve profile traits by profile ID. Use the `traitGroups` query parameter to restrict results to a comma-separated allow list of trait group names. For large sets of traits, prefer using the dedicated `/Traits` endpoint for pagination.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - traitGroups:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(Profile)
        RETURNVAR: twilio_memory_store_profiles_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.profiles.get
  twilio_memory.store.profiles.update:
    SUMMARY: Patch Profile Traits
    DESC: Merge one or more trait groups into an existing profile. Only the traits provided are added or updated; unspecified traits remain unchanged. Only pre-defined trait groups and traits configured for the memory store can be patched. To remove a trait entirely, set its value to null.
    HTTP:
      METHOD: PATCH
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ProfilePatch)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(ProfilePatch)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.store.profiles.updateResponse202)
        RETURNVAR: twilio_memory_store_profiles_update_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.profiles.update
  twilio_memory.store.lookup.create:
    SUMMARY: Lookup Profiles
    DESC: Find profiles that contain a specific identifier value (for example a phone number or email address). Submit an identifier object specifying the `idType` and `value`. The value is normalized using the configured identity resolution settings (such as phone number formatting) prior to matching. Multiple matches are returned if more than one profile is associated with the identifier. Returns canonical profile IDs (the earliest ID if profiles have been merged) along with the normalized value actually searched.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/Stores/{storeId}/Profiles/Lookup
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Identifier)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(Identifier)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.store.lookup.createResponse200)
        RETURNVAR: twilio_memory_store_lookup_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.lookup.create
  twilio_memory.store.identifiers.get:
    SUMMARY: List Profile Identifiers
    DESC: Retrieve all identifier types linked to a profile along with their stored values. Use this to audit which external keys (phone, email, externalId, etc.) are currently associated. Values are returned in the order enforced by each identifier settings `limitPolicy` and reflect any normalization applied by the service.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Identifiers
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(api.store.identifiers.getResponse200)
        RETURNVAR: twilio_memory_store_identifiers_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.identifiers.get
  twilio_memory.store.identifiers.create:
    SUMMARY: Add Profile Identifier
    DESC: Asynchronously attach a new identifier value to a profile. When multiple values exist for an `idType`, ordering, limits, and uniqueness checks are enforced by the corresponding identifier settings `limitPolicy` and  reflect any normalization. If the identifier already exists and points to another profile, resolution rules or merge processes may apply. Use the identifier specific endpoint to inspect, update, or remove existing values.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Identifiers
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(Identifier)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(Identifier)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.store.identifiers.createResponse202)
        RETURNVAR: twilio_memory_store_identifiers_create_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.identifiers.create
  twilio_memory.store.identifiers.get.1:
    SUMMARY: Retrieve Profile Identifier
    DESC: Retrieve all stored values for a specific identifier type on a profile. Values are normalized according to the configured identifier settings and returned in the order determined by its `limitPolicy`.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Identifiers/{idType}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - idType:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(IdentifierSet)
        RETURNVAR: twilio_memory_store_identifiers_get_1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.identifiers.get.1
  twilio_memory.store.identifiers.update:
    SUMMARY: Modify Profile Identifier
    DESC: |-
      Asynchronously replace one of the stored values associated with the
      identifier type on a profile. `newValue` is normalized according to
      the configured identifier settings.

      If the new identifier already exists and points to another profile,
      merge processes may apply.
    HTTP:
      METHOD: PATCH
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Identifiers/{idType}
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(IdentifierUpdate)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - idType:
          TYPE: STRING
          LOCATION: path
      - body:
          TYPE: STRUCT(IdentifierUpdate)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.store.identifiers.updateResponse202)
        RETURNVAR: twilio_memory_store_identifiers_update_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 409
        WHEN: Conflict (HTTP 409)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.identifiers.update
  twilio_memory.store.identifiers.delete:
    SUMMARY: Remove Profile Identifier
    DESC: Asynchronously remove stored values for the identifier type. The optional `removeAll` query parameter allows bulk removal; otherwise the service selects a single value to delete using the identifier settings `limitPolicy`.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Identifiers/{idType}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - idType:
          TYPE: STRING
          LOCATION: path
      - removeAll:
          TYPE: BOOL
          REQUIRED: false
          LOCATION: query
          DEFAULT: false
    RETURNS:
      - RETURNTYPE: STRUCT(api.store.identifiers.deleteResponse202)
        RETURNVAR: twilio_memory_store_identifiers_delete_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.identifiers.delete
  twilio_memory.store.recall.create:
    SUMMARY: Retrieve Memories
    DESC: Tailored memory retrieval for agentic workloads. Supports hybrid semantic search, date ranges, and configurable result limits for different memory types. This endpoint is optimized for conversational AI and memory retrieval use cases. If a query is not specified then one is inferred from the conversation context. If neither a query nor a conversationId is provided, results are returned in most-recent order without relevance scores.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Recall
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(MemoryRetrievalRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - Accept-Encoding:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - Content-Encoding:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(MemoryRetrievalRequest)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(MemoryRetrievalResponse)
        RETURNVAR: twilio_memory_store_recall_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.recall.create
  twilio_memory.store.observations.get:
    SUMMARY: List Observations
    DESC: Retrieve a paginated list of transient observations for a specific profile. Observations are sorted by creation time in descending order by default. Results can be filtered by source parameter. Supports response compression for large datasets.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Observations
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 50
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - orderBy:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
          DEFAULT: DESC
      - source:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - createdAfter:
          TYPE: TIMESTAMP
          REQUIRED: false
          LOCATION: query
      - createdBefore:
          TYPE: TIMESTAMP
          REQUIRED: false
          LOCATION: query
      - Accept-Encoding:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
    RETURNS:
      - RETURNTYPE: STRUCT(api.store.observations.getResponse200)
        RETURNVAR: twilio_memory_store_observations_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.observations.get
  twilio_memory.store.observations.create:
    SUMMARY: Create Observations
    DESC: Create one or more transient observations associated with the specified profile. Supports both single observation creation and batch creation of up to 10 observations. Supports request compression for large batch operations and response compression for the response. All observations will be automatically indexed for semantic search capabilities. The content can be up to 4KB in length and should contain relevant information about the profile. The createdAt and updatedAt timestamps will be automatically set to the current time. Each observation will be created with a unique ID in Twilio Type ID (TTID) format.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Observations
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(CreateObservationsRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - Accept-Encoding:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - Content-Encoding:
          TYPE: STRING
          REQUIRED: false
          LOCATION: header
      - body:
          TYPE: STRUCT(CreateObservationsRequest)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(ObservationCreatedResponse)
        RETURNVAR: twilio_memory_store_observations_create_202
        STATUS: 202
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
    CANONICAL_ID: twilio_memory.store.observations.create
  twilio_memory.store.observations.get.1:
    SUMMARY: Retrieve Observation
    DESC: Retrieve a specific transient observation by its ID for the given profile.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/Stores/{storeId}/Profiles/{profileId}/Observations/{observationId}
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - storeId:
          TYPE: STRING
          LOCATION: path
      - profileId:
          TYPE: STRING
          LOCATION: path
      - observationId:
          TYPE: STRING
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ObservationInfo)
        RETURNVAR: twilio_memory_store_observations_get_1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(TwilioError)
        STATUS: 400
        WHEN: Bad Request (HTTP 400)
      - TYPE: STRUCT(TwilioError)
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: STRUCT(TwilioError)
        STATUS: 403
        WHEN: Forbidden (HTTP 403)
      - TYPE: STRUCT(TwilioError)
        STATUS: 404
        WHEN: Not Found (HTTP 404)
      - TYPE: STRUCT(TwilioError)
        STATUS: 429
        WHEN: This error indicates that you have sent too many requests to the API. You should retry according to the `Retry-After` response header. (HTTP 429)
      - TYPE: STRUCT(TwilioError)
        STATUS: 500
        WHEN: Internal Server Error (HTTP 500)
      - TYPE: STRUCT(TwilioError)
        STATUS: 503
        WHEN: Service Unavailable (HTTP 503)
