  PublicApiRoleAssignmentResponse:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: Twilio Role Assignment Sid representing this role assignment
    - name: role_sid
      type: STRING
      REQUIRED: false
      comment: Twilio Role Sid representing assigned role
    - name: scope
      type: STRING
      REQUIRED: false
      comment: Twilio Sid representing identity of this assignment
    - name: identity
      type: STRING
      REQUIRED: false
      comment: Twilio Sid representing scope of this assignment
    - name: resource_type
      type: STRING
      REQUIRED: false
      comment: The resource type for resource-level role assignments
    - name: resource_id
      type: STRING
      REQUIRED: false
      comment: The resource id for resource-level role assignments
  oauth.v1.token:
    - name: access_token
      type: STRING
      REQUIRED: false
      comment: Token which carries the necessary information to access a Twilio resource directly.
    - name: refresh_token
      type: STRING
      REQUIRED: false
      comment: Token which carries the information necessary to get a new access token.
    - name: id_token
      type: STRING
      REQUIRED: false
      comment: Token which carries the information necessary of user profile.
    - name: token_type
      type: STRING
      REQUIRED: false
      comment: Token type
    - name: expires_in
