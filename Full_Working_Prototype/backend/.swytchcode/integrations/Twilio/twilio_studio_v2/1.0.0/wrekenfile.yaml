STRUCTS:
  studio.v2.flow.execution:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Execution resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Execution resource.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: contact_channel_address
      type: STRING
      REQUIRED: false
      comment: The phone number, SIP address or Client identifier that triggered the Execution. Phone numbers are in E.164 format (e.g. +16175551212). SIP addresses are formatted as `name@company.com`. Client identifiers are formatted `client:name`.
    - name: contact_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Contact.
    - name: flow_version
      type: INT
      REQUIRED: false
      comment: The Flow version number at the time of Execution creation.
    - name: context
      type: ANY
      REQUIRED: false
      comment: The current state of the Flow's Execution. As a flow executes, we save its state in this context. We save data that your widgets can access as variables in configuration fields or in text areas as variable substitution.
    - name: status
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: initiated_by
      type: STRING
      REQUIRED: false
      comment: The SID or identifier that triggered this Execution. For example, a Call SID if triggered by an incoming call, a Message SID if triggered by an incoming message, a Request SID if triggered by a REST API request, and so on.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URLs of nested resources.
  studio.v2.flow.execution.execution_context:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the ExecutionContext resource.
    - name: context
      type: ANY
      REQUIRED: false
      comment: The current state of the Flow's Execution. As a flow executes, we save its state in this context. We save data that your widgets can access as variables in configuration fields or in text areas as variable substitution.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: execution_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the context's Execution resource.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  studio.v2.flow.execution.execution_step:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the ExecutionStep resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the ExecutionStep resource.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: execution_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Step's Execution resource.
    - name: parent_step_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the parent Step.
    - name: name
      type: STRING
      REQUIRED: false
      comment: The event that caused the Flow to transition to the Step.
    - name: context
      type: ANY
      REQUIRED: false
      comment: The current state of the Flow's Execution. As a flow executes, we save its state in this context. We save data that your widgets can access as variables in configuration fields or in text areas as variable substitution.
    - name: transitioned_from
      type: STRING
      REQUIRED: false
      comment: The Widget that preceded the Widget for the Step.
    - name: transitioned_to
      type: STRING
      REQUIRED: false
      comment: The Widget that will follow the Widget for the Step.
    - name: type
      type: STRING
      REQUIRED: false
      comment: The type of the widget that was executed.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: The URLs of related resources.
  studio.v2.flow.execution.execution_step.execution_step_context:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the ExecutionStepContext resource.
    - name: context
      type: ANY
      REQUIRED: false
      comment: The current state of the Flow's Execution. As a flow executes, we save its state in this context. We save data that your widgets can access as variables in configuration fields or in text areas as variable substitution.
    - name: execution_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the context's Execution resource.
    - name: flow_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Flow.
    - name: step_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Step that the context is associated with.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
  studio.v2.flow:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Flow resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Flow resource.
    - name: author_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the User that created or last updated the Flow.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The string that you assigned to describe the Flow.
    - name: definition
      type: ANY
      REQUIRED: false
      comment: JSON representation of flow definition.
    - name: status
      type: STRING
      REQUIRED: false
    - name: revision
      type: INT
      REQUIRED: false
      comment: The latest revision number of the Flow's definition.
    - name: commit_message
      type: STRING
      REQUIRED: false
      comment: Description of change made in the revision.
    - name: valid
      type: BOOL
      REQUIRED: false
      comment: Boolean if the flow definition is valid.
    - name: errors
      type: "[]ANY"
      REQUIRED: false
      comment: List of error in the flow definition.
    - name: warnings
      type: "[]ANY"
      REQUIRED: false
      comment: List of warnings in the flow definition.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: webhook_url
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the resource.
    - name: links
      type: OBJECT
