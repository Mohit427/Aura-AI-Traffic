STRUCTS:
  insights.v1.account_settings:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: advanced_features
      type: BOOL
      REQUIRED: false
      comment: A boolean flag indicating whether Advanced Features for Voice Insights are enabled.
    - name: voice_trace
      type: BOOL
      REQUIRED: false
      comment: A boolean flag indicating whether Voice Trace is enabled.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
  insights.v1.call.annotation:
    - name: call_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Call.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: answered_by
      type: STRING
      REQUIRED: false
      comment: "Specifies which entity answered the call as determined by Answering Machine Detection. Possible enumerated values, one of: `human`, `machine`. `human` indicates the call was answered by a person. `machine` indicates the call was answered by an answering machine."
    - name: connectivity_issue
      type: STRING
      REQUIRED: false
      comment: Specifies if the call had any connectivity issues. One of `no_connectivity_issue`, `invalid_number`, `caller_id`, `dropped_call`, or `number_reachability`.
    - name: quality_issues
      type: "[]STRING"
      REQUIRED: false
      comment: Specifies if the call had any subjective quality issues. Possible values are one or more of `no_quality_issue`, `low_volume`, `choppy_robotic`, `echo`, `dtmf`, `latency`, `owa`, or `static_noise`.
    - name: spam
      type: BOOL
      REQUIRED: false
      comment: "Specifies if the call was a spam call. Use this to provide feedback on whether calls placed from your account were marked as spam, or if inbound calls received by your account were unwanted spam. Is of type Boolean: true, false. Use true if the call was a spam call."
    - name: call_score
      type: INT
      REQUIRED: false
      comment: "Specifies the Call Score, if available. This is of type integer. Use a range of 1-5 to indicate the call experience score, with the following mapping as a reference for rating the call [5: Excellent, 4: Good, 3 : Fair, 2 : Poor, 1: Bad]."
    - name: comment
      type: STRING
      REQUIRED: false
      comment: Specifies any comments pertaining to the call. Twilio does not treat this field as PII, so no PII should be included in comments.
    - name: incident
      type: STRING
      REQUIRED: false
      comment: Incident or support ticket associated with this call. The `incident` property is of type string with a maximum character limit of 100. Twilio does not treat this field as PII, so no PII should be included in `incident`.
    - name: url
      type: STRING
      REQUIRED: false
  insights.v1.call:
    - name: sid
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
    - name: links
      type: OBJECT
      REQUIRED: false
  insights.v1.call_summaries:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account.
    - name: call_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Call.
    - name: answered_by
      type: STRING
      REQUIRED: false
      comment: The Answered By value for the summarized call based on `Answering Machine Detection (AMD)`. One of `unknown`, `machine_start`, `machine_end_beep`, `machine_end_silence`, `machine_end_other`, `human` or `fax`. Refer to [AMD](https://www.twilio.com/docs/voice/answering-machine-detection) for more detail.
    - name: call_type
      type: STRING
      REQUIRED: false
      comment: The Call Type of the summarized Call. One of `carrier`, `sip`, `trunking` or `client`.
    - name: call_state
      type: STRING
      REQUIRED: false
      comment: The Call State of the summarized Call. One of `ringing`, `completed`, `busy`, `fail`, `noanswer`, `canceled`, `answered`, `undialed`.
    - name: processing_state
      type: STRING
      REQUIRED: false
      comment: The Processing State of the Call Summary. The Processing State will be `partial` until the assembly of the Call Summary finishes, which occurs approximately 30 minutes after Call end. Then the Processing State changes to `complete`
    - name: created_time
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the Call was created, given in ISO 8601 format. Can be different from `start_time` in the event of queueing due to CPS
    - name: start_time
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the Call was started, given in ISO 8601 format.
    - name: end_time
      type: TIMESTAMP
      REQUIRED: false
      comment: The time at which the Call was ended, given in ISO 8601 format.
    - name: duration
      type: INT
      REQUIRED: false
