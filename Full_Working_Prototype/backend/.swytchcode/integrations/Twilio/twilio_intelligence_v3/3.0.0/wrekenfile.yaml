VERSION: 2.0.2
DEFAULTS:
  basic_auth: Basic <BASE64>
  w_base_url: https://intelligence.twilio.com
METHODS:
  twilio_conversational_intelligence.controlplane.configurations.create:
    SUMMARY: Create an Intelligence Configuration
    DESC: |
      Create an Intelligence Configuration to control how and when language operators analyze conversations.

      You must include the `rules` field in the request. You can pass an empty array (`"rules": []`), but an Intelligence Configuration with an empty `rules` array doesn't execute any language operators. To add rules later, make a `PUT /v3/ControlPlane/Configurations/{id}` request.

      After creating an Intelligence Configuration, you must attach it to a Conversations Configuration by using the Conversations API.
    HTTP:
      METHOD: POST
      ENDPOINT: /v3/ControlPlane/Configurations
      HEADERS:
        Content-Type: application/json
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(api.controlplane.configurations.createRequest)
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(api.controlplane.configurations.createRequest)
          LOCATION: body
    RETURNS:
      - RETURNTYPE: STRUCT(api.controlplane.configurations.createResponse201)
        RETURNVAR: twilio_conversational_intelligence_controlplane_configurations_create_201
        STATUS: 201
    ERRORS:
      - TYPE: STRUCT(CreateConfiguration_Error400)
        STATUS: 400
        WHEN: Bad request (HTTP 400)
      - TYPE: STRUCT(CreateConfiguration_Error429)
        STATUS: 429
        WHEN: Too Many requests (rate limit exceeded for request originating from public API) (HTTP 429)
      - TYPE: STRUCT(CreateConfiguration_Error500)
        STATUS: 500
        WHEN: Internal server error (HTTP 500)
    CANONICAL_ID: twilio_conversational_intelligence.controlplane.configurations.create
  twilio_conversational_intelligence.controlplane.configurations.list:
    SUMMARY: Retrieve a list of Intelligence Configurations
    HTTP:
      METHOD: GET
      ENDPOINT: /v3/ControlPlane/Configurations
      HEADERS:
        Authorization: basic_auth
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - pageSize:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 50
      - pageToken:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(api.controlplane.configurations.listResponse200)
        RETURNVAR: twilio_conversational_intelligence_controlplane_configurations_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(ListConfigurations_Error429)
        STATUS: 429
        WHEN: Too Many requests (rate limit exceeded for request originating from public API) (HTTP 429)
      - TYPE: STRUCT(ListConfigurations_Error500)
