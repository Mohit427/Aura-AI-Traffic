STRUCTS:
  conversations.v1.configuration:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) responsible for this configuration.
    - name: default_chat_service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the default [Conversation Service](https://www.twilio.com/docs/conversations/api/service-resource) used when creating a conversation.
    - name: default_messaging_service_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the default [Messaging Service](https://www.twilio.com/docs/messaging/api/service-resource) used when creating a conversation.
    - name: default_inactive_timer
      type: STRING
      REQUIRED: false
      comment: Default ISO8601 duration when conversation will be switched to `inactive` state. Minimum value for this timer is 1 minute.
    - name: default_closed_timer
      type: STRING
      REQUIRED: false
      comment: Default ISO8601 duration when conversation will be switched to `closed` state. Minimum value for this timer is 10 minutes.
    - name: url
      type: STRING
      REQUIRED: false
      comment: An absolute API resource URL for this global configuration.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: Contains absolute API resource URLs to access the webhook and default service configurations.
  conversations.v1.configuration_address:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Account](https://www.twilio.com/docs/iam/api/account) the address belongs to
    - name: type
      type: STRING
      REQUIRED: false
      comment: Type of Address, value can be `whatsapp` or `sms`.
    - name: address
      type: STRING
      REQUIRED: false
      comment: The unique address to be configured. The address can be a whatsapp address or phone number
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The human-readable name of this configuration, limited to 256 characters. Optional.
    - name: auto_creation
      type: ANY
      REQUIRED: false
      comment: Auto Creation configuration for the address.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was created.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was last updated.
    - name: url
      type: STRING
      REQUIRED: false
      comment: An absolute API resource URL for this address configuration.
    - name: address_country
      type: STRING
      REQUIRED: false
      comment: An ISO 3166-1 alpha-2n country code which the address belongs to. This is currently only applicable to short code addresses.
  conversations.v1.configuration.configuration_webhook:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Account](https://www.twilio.com/docs/iam/api/account) responsible for this conversation.
    - name: method
      type: STRING
      REQUIRED: false
    - name: filters
      type: "[]STRING"
      REQUIRED: false
      comment: "The list of webhook event triggers that are enabled for this Service: `onMessageAdded`, `onMessageUpdated`, `onMessageRemoved`, `onMessageAdd`, `onMessageUpdate`, `onMessageRemove`, `onConversationUpdated`, `onConversationRemoved`, `onConversationAdd`, `onConversationAdded`, `onConversationRemove`, `onConversationUpdate`, `onConversationStateUpdated`, `onParticipantAdded`, `onParticipantUpdated`, `onParticipantRemoved`, `onParticipantAdd`, `onParticipantRemove`, `onParticipantUpdate`, `onDeliveryUpdated`, `onUserAdded`, `onUserUpdate`, `onUserUpdated`"
    - name: pre_webhook_url
      type: STRING
      REQUIRED: false
      comment: The absolute url the pre-event webhook request should be sent to.
    - name: post_webhook_url
      type: STRING
      REQUIRED: false
      comment: The absolute url the post-event webhook request should be sent to.
    - name: target
      type: STRING
      REQUIRED: false
    - name: url
      type: STRING
      REQUIRED: false
      comment: An absolute API resource API resource URL for this webhook.
  conversations.v1.conversation:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Account](https://www.twilio.com/docs/iam/api/account) responsible for this conversation.
    - name: chat_service_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Conversation Service](https://www.twilio.com/docs/conversations/api/service-resource) this conversation belongs to.
    - name: messaging_service_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Messaging Service](https://www.twilio.com/docs/messaging/api/service-resource) this conversation belongs to.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: The human-readable name of this conversation, limited to 256 characters. Optional.
    - name: unique_name
      type: STRING
      REQUIRED: false
      comment: An application-defined string that uniquely identifies the resource. It can be used to address the resource in place of the resource's `sid` in the URL.
    - name: attributes
      type: STRING
      REQUIRED: false
      comment: An optional string metadata field you can use to store any data you wish. The string value must contain structurally valid JSON if specified.  **Note** that if the attributes are not set "{}" will be returned.
    - name: state
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was created.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was last updated.
    - name: timers
      type: ANY
      REQUIRED: false
      comment: Timer date values representing state update for this conversation.
    - name: url
      type: STRING
      REQUIRED: false
      comment: An absolute API resource URL for this conversation.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: Contains absolute URLs to access the [participants](https://www.twilio.com/docs/conversations/api/conversation-participant-resource), [messages](https://www.twilio.com/docs/conversations/api/conversation-message-resource) and [webhooks](https://www.twilio.com/docs/conversations/api/conversation-scoped-webhook-resource) of this conversation.
    - name: bindings
      type: ANY
      REQUIRED: false
  conversations.v1.conversation.conversation_message:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Account](https://www.twilio.com/docs/iam/api/account) responsible for this message.
    - name: conversation_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Conversation](https://www.twilio.com/docs/conversations/api/conversation-resource) for this message.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this resource.
    - name: index
      type: INT
      REQUIRED: false
      comment: The index of the message within the [Conversation](https://www.twilio.com/docs/conversations/api/conversation-resource).  Indices may skip numbers, but will always be in order of when the message was received.
    - name: author
      type: STRING
      REQUIRED: false
      comment: The channel specific identifier of the message's author. Defaults to `system`.
    - name: body
      type: STRING
      REQUIRED: false
      comment: The content of the message, can be up to 1,600 characters long.
    - name: media
      type: "[]ANY"
      REQUIRED: false
      comment: "An array of objects that describe the Message's media, if the message contains media. Each object contains these fields: `content_type` with the MIME type of the media, `filename` with the name of the media, `sid` with the SID of the Media resource, and `size` with the media object's file size in bytes. If the Message has no media, this value is `null`."
    - name: attributes
      type: STRING
      REQUIRED: false
      comment: A string metadata field you can use to store any data you wish. The string value must contain structurally valid JSON if specified.  **Note** that if the attributes are not set "{}" will be returned.
    - name: participant_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of messages's author participant. Null in case of `system` sent message.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was created.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this resource was last updated. `null` if the message has not been edited.
    - name: url
      type: STRING
      REQUIRED: false
      comment: An absolute API resource API URL for this message.
    - name: delivery
      type: ANY
      REQUIRED: false
      comment: An object that contains the summary of delivery statuses for the message to non-chat participants.
    - name: links
      type: OBJECT
      REQUIRED: false
      comment: Contains an absolute API resource URL to access the delivery & read receipts of this message.
    - name: content_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the multi-channel [Rich Content](https://www.twilio.com/docs/content) template.
  conversations.v1.conversation.conversation_message.conversation_message_receipt:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Account](https://www.twilio.com/docs/iam/api/account) responsible for this participant.
    - name: conversation_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the [Conversation](https://www.twilio.com/docs/conversations/api/conversation-resource) for this message.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this resource.
    - name: message_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the message within a [Conversation](https://www.twilio.com/docs/conversations/api/conversation-resource) the delivery receipt belongs to
    - name: channel_message_sid
      type: STRING
      REQUIRED: false
      comment: "A messaging channel-specific identifier for the message delivered to participant e.g. `SMxx` for SMS, `WAxx` for Whatsapp etc. "
    - name: participant_sid
      type: STRING
      REQUIRED: false
      comment: The unique ID of the participant the delivery receipt belongs to.
    - name: status
      type: STRING
      REQUIRED: false
    - name: error_code
