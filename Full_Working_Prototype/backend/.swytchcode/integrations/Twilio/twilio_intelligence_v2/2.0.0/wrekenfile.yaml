  intelligence.v2.transcript.operator_result:
    - name: operator_type
      type: STRING
      REQUIRED: false
    - name: name
      type: STRING
      REQUIRED: false
      comment: The name of the applied Language Understanding.
    - name: operator_sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that identifies this Language Understanding operator sid.
