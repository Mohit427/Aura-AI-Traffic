STRUCTS:
  supersim.v1.sim.billing_period:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Billing Period.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) the Super SIM belongs to.
    - name: sim_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Super SIM the Billing Period belongs to.
    - name: start_time
      type: TIMESTAMP
      REQUIRED: false
      comment: The start time of the Billing Period specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: end_time
      type: TIMESTAMP
      REQUIRED: false
      comment: The end time of the Billing Period specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: period_type
      type: STRING
      REQUIRED: false
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
  supersim.v1.esim_profile:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the eSIM Profile resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) to which the eSIM Profile resource belongs.
    - name: iccid
      type: STRING
      REQUIRED: false
      comment: The [ICCID](https://en.wikipedia.org/wiki/Subscriber_identity_module#ICCID) associated with the Sim resource.
    - name: sim_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Sim](https://www.twilio.com/docs/iot/supersim/api/sim-resource) resource that this eSIM Profile controls.
    - name: status
      type: STRING
      REQUIRED: false
    - name: eid
      type: STRING
      REQUIRED: false
      comment: Identifier of the eUICC that can claim the eSIM Profile.
    - name: smdp_plus_address
      type: STRING
      REQUIRED: false
      comment: Address of the SM-DP+ server from which the Profile will be downloaded. The URL will appear once the eSIM Profile reaches the status `available`.
    - name: matching_id
      type: STRING
      REQUIRED: false
      comment: Unique identifier of the eSIM profile that can be used to identify and download the eSIM profile from the SM-DP+ server. Populated if `generate_matching_id` is set to `true` when creating the eSIM profile reservation.
    - name: activation_code
      type: STRING
      REQUIRED: false
      comment: Combined machine-readable activation code for acquiring an eSIM Profile with the Activation Code download method. Can be used in a QR code to download an eSIM profile.
    - name: error_code
      type: STRING
      REQUIRED: false
      comment: Code indicating the failure if the download of the SIM Profile failed and the eSIM Profile is in `failed` state.
    - name: error_message
      type: STRING
      REQUIRED: false
      comment: Error message describing the failure if the download of the SIM Profile failed and the eSIM Profile is in `failed` state.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the eSIM Profile resource.
  supersim.v1.fleet:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the Fleet resource.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Fleet resource.
    - name: unique_name
      type: STRING
      REQUIRED: false
      comment: An application-defined string that uniquely identifies the resource. It can be used in place of the resource's `sid` in the URL to address the resource.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Fleet resource.
    - name: data_enabled
      type: BOOL
      REQUIRED: false
      comment: Defines whether SIMs in the Fleet are capable of using 2G/3G/4G/LTE/CAT-M data connectivity. Defaults to `true`.
    - name: data_limit
      type: INT
      REQUIRED: false
      comment: The total data usage (download and upload combined) in Megabytes that each Super SIM assigned to the Fleet can consume during a billing period (normally one month). Value must be between 1MB (1) and 2TB (2,000,000). Defaults to 250MB.
    - name: data_metering
      type: STRING
      REQUIRED: false
    - name: sms_commands_enabled
      type: BOOL
      REQUIRED: false
      comment: Defines whether SIMs in the Fleet are capable of sending and receiving machine-to-machine SMS via Commands. Defaults to `false`.
    - name: sms_commands_url
      type: STRING
      REQUIRED: false
      comment: The URL that will receive a webhook when a Super SIM in the Fleet is used to send an SMS from your device to the SMS Commands number. Your server should respond with an HTTP status code in the 200 range; any response body will be ignored.
    - name: sms_commands_method
      type: STRING
      REQUIRED: false
      comment: A string representing the HTTP method to use when making a request to `sms_commands_url`. Can be one of `POST` or `GET`. Defaults to `POST`.
    - name: network_access_profile_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the Network Access Profile that controls which cellular networks the Fleet's SIMs can connect to.
    - name: ip_commands_url
      type: STRING
      REQUIRED: false
      comment: The URL that will receive a webhook when a Super SIM in the Fleet is used to send an IP Command from your device to a special IP address. Your server should respond with an HTTP status code in the 200 range; any response body will be ignored.
    - name: ip_commands_method
      type: STRING
      REQUIRED: false
      comment: A string representing the HTTP method to use when making a request to `ip_commands_url`. Can be one of `POST` or `GET`. Defaults to `POST`.
  supersim.v1.ip_command:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the IP Command resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that created the IP Command resource.
    - name: sim_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Super SIM](https://www.twilio.com/docs/iot/supersim/api/sim-resource) that this IP Command was sent to or from.
    - name: sim_iccid
      type: STRING
      REQUIRED: false
      comment: The [ICCID](https://en.wikipedia.org/wiki/Subscriber_identity_module#ICCID) of the [Super SIM](https://www.twilio.com/docs/iot/supersim/api/sim-resource) that this IP Command was sent to or from.
    - name: status
      type: STRING
      REQUIRED: false
    - name: direction
      type: STRING
      REQUIRED: false
    - name: device_ip
      type: STRING
      REQUIRED: false
      comment: The IP address of the device that the IP Command was sent to or received from. For an IP Command sent to a Super SIM, `device_ip` starts out as `null`, and once the IP Command is “sent”, the `device_ip` will be filled out. An IP Command sent from a Super SIM have its `device_ip` always set.
    - name: device_port
      type: INT
      REQUIRED: false
      comment: For an IP Command sent to a Super SIM, it would be the destination port of the IP message. For an IP Command sent from a Super SIM, it would be the source port of the IP message.
    - name: payload_type
      type: STRING
      REQUIRED: false
    - name: payload
      type: STRING
      REQUIRED: false
      comment: |-
        The payload that is carried in the IP/UDP message. The payload can be encoded in either text or binary format. For text payload, UTF-8 encoding must be used.

        For an IP Command sent to a Super SIM, the payload is appended to the IP/UDP message “as is”. The payload should not exceed 1300 bytes.

        For an IP Command sent from a Super SIM, the payload from the received IP/UDP message is extracted and sent in binary encoding. For an IP Command sent from a Super SIM, the payload should not exceed 1300 bytes. If it is larger than 1300 bytes, there might be fragmentation on the upstream and the message may appear truncated.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the IP Command resource.
  supersim.v1.network:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that we created to identify the Network resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human readable identifier of this resource.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Network resource.
    - name: iso_country
      type: STRING
      REQUIRED: false
      comment: The [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) of the Network resource.
    - name: identifiers
      type: "[]ANY"
      REQUIRED: false
      comment: Array of objects identifying the [MCC-MNCs](https://en.wikipedia.org/wiki/Mobile_country_code) that are included in the Network resource.
  supersim.v1.network_access_profile:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that identifies the Network Access Profile resource.
    - name: unique_name
      type: STRING
      REQUIRED: false
      comment: An application-defined string that uniquely identifies the resource. It can be used in place of the resource's `sid` in the URL to address the resource.
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The SID of the [Account](https://www.twilio.com/docs/iam/api/account) that the Network Access Profile belongs to.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was created specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date and time in GMT when the resource was last updated specified in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Network Access Profile resource.
    - name: links
      type: OBJECT
      REQUIRED: false
  supersim.v1.network_access_profile.network_access_profile_network:
    - name: sid
      type: STRING
      REQUIRED: false
      comment: The unique string that identifies the Network resource.
    - name: network_access_profile_sid
      type: STRING
      REQUIRED: false
      comment: The unique string that identifies the Network resource's Network Access Profile resource.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human readable identifier of the Network this resource refers to.
    - name: iso_country
      type: STRING
      REQUIRED: false
      comment: The [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) of the Network resource.
    - name: identifiers
      type: "[]ANY"
      REQUIRED: false
      comment: Array of objects identifying the [MCC-MNCs](https://en.wikipedia.org/wiki/Mobile_country_code) that are included in the Network resource.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The absolute URL of the Network resource.
  supersim.v1.settings_update:
    - name: sid
      type: STRING
      REQUIRED: false
