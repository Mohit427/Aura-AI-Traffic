    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
  intelligence.v2.operator_type:
    - name: name
      type: STRING
      REQUIRED: false
      comment: A unique name that references an Operator's Operator Type.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Operator Type.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human-readable name of this resource, up to 64 characters.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A human-readable description of this resource, longer than the friendly name.
    - name: docs_link
      type: STRING
      REQUIRED: false
      comment: Additional documentation for the Operator Type.
    - name: output_type
      type: STRING
      REQUIRED: false
    - name: supported_languages
      type: "[]STRING"
      REQUIRED: false
      comment: List of languages this Operator Type supports.
    - name: provider
      type: STRING
      REQUIRED: false
    - name: availability
      type: STRING
      REQUIRED: false
    - name: configurable
      type: BOOL
      REQUIRED: false
      comment: Operators can be created from configurable Operator Types.
    - name: config_schema
      type: ANY
      REQUIRED: false
      comment: JSON Schema for configuring an Operator with this Operator Type. Following https://json-schema.org/
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Operator Type was created, given in ISO 8601 format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Operator Type was updated, given in ISO 8601 format.
    - name: url
      type: STRING
      REQUIRED: false
      comment: The URL of this resource.
  intelligence.v2.prebuilt_operator:
    - name: account_sid
      type: STRING
      REQUIRED: false
      comment: The unique SID identifier of the Account the Pre-built Operator belongs to.
    - name: sid
      type: STRING
      REQUIRED: false
      comment: A 34 character string that uniquely identifies this Pre-built Operator.
    - name: friendly_name
      type: STRING
      REQUIRED: false
      comment: A human-readable name of this resource, up to 64 characters.
    - name: description
      type: STRING
      REQUIRED: false
      comment: A human-readable description of this resource, longer than the friendly name.
    - name: author
      type: STRING
      REQUIRED: false
      comment: The creator of the Operator. Pre-built Operators can only be created by Twilio.
    - name: operator_type
      type: STRING
      REQUIRED: false
      comment: Operator Type for this Operator. References an existing Operator Type resource.
    - name: version
      type: INT
      REQUIRED: false
      comment: Numeric Operator version. Incremented with each update on the resource, used to ensure integrity when updating the Operator.
    - name: availability
      type: STRING
      REQUIRED: false
    - name: config
      type: ANY
      REQUIRED: false
      comment: Operator configuration, following the schema defined by the Operator Type. Only available on Custom Operators created by the Account, will be empty for Pre-Built Operators.
    - name: date_created
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Pre-built Operator was created, given in ISO 8601 format.
    - name: date_updated
      type: TIMESTAMP
      REQUIRED: false
      comment: The date that this Pre-built Operator was updated, given in ISO 8601 format.
    - name: url
      type: STRING
      REQUIRED: false
